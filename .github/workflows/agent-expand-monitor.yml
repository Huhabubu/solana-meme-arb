name: agent-expand-monitor

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/agent-expand-monitor.yml
      - tools/agent_expand_monitor.py

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.head_ref == 'agent/fix-coherent-snapshots'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v7
        with:
          ref: agent/fix-coherent-snapshots
          fetch-depth: 0

      - name: Install stable Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy

      - name: Fix staged matcher and apply scoped monitor patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/agent_expand_monitor.py")
          text = path.read_text()
          helper_anchor = "\ndef sub_once(text: str, pattern: str, replacement: str, label: str) -> str:\n"
          helper = '''\ndef replace_first(text: str, old: str, new: str, label: str) -> str:\n    if old not in text:\n        raise RuntimeError(f"{label}: expected at least one match")\n    return text.replace(old, new, 1)\n\n'''
          if "def replace_first(" not in text:
              if helper_anchor not in text:
                  raise RuntimeError("replace_first insertion anchor missing")
              text = text.replace(helper_anchor, helper + helper_anchor, 1)

          marker = '"owner request limit constant",'
          marker_pos = text.find(marker)
          if marker_pos < 0:
              raise RuntimeError("owner request matcher marker missing")
          call_pos = text.rfind("rpc = replace_once(", 0, marker_pos)
          if call_pos < 0:
              raise RuntimeError("owner request replace_once call missing")
          text = (
              text[:call_pos]
              + text[call_pos:].replace("rpc = replace_once(", "rpc = replace_first(", 1)
          )
          path.write_text(text)
          PY
          python3 tools/agent_expand_monitor.py

      - name: Format
        run: cargo fmt --all

      - name: Diff sanity
        run: |
          git diff --check
          ! grep -R "FIXED_V3_POOL_ADDRESSES\|fixed V3 universe" -n src/app.rs

      - name: Compile check
        run: cargo check --locked --all-targets

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --locked --all-targets

      - name: Live one-update monitor smoke
        if: ${{ env.HELIUS_API_KEY != '' }}
        env:
          OPPORTUNITY_LOG_PATH: /tmp/agent-expand-monitor.jsonl
        run: timeout 180s cargo run --locked -- opportunity-wss-check

      - name: Commit verified patch
        run: |
          rm -f tools/agent_expand_monitor.py .github/workflows/agent-expand-monitor.yml
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "research: expand coherent monitor universe"
          git push origin HEAD:agent/fix-coherent-snapshots
