name: Arb Bot Event Study

on:
  workflow_dispatch:
  push:
    paths:
      - "research/arb_bot_event_study.py"
      - "research/arb_bot_event_report.py"
      - "research/arb_bot_event_blocks.py"
      - "research/arb_bot_chain_order.py"
      - "research/arb_bot_confirmed_events.py"
      - ".github/workflows/arb-bot-event-study.yml"

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: |
          python -m py_compile research/arb_bot_event_study.py
          python -m py_compile research/arb_bot_event_report.py
          python -m py_compile research/arb_bot_event_blocks.py
          python -m py_compile research/arb_bot_chain_order.py
          python -m py_compile research/arb_bot_confirmed_events.py
      - name: Run live candidate scan
        run: |
          python research/arb_bot_event_study.py \
            --mint-limit 20 \
            --bot-history-rows 300 \
            --arb-events-per-mint 5 \
            --search-window-ms 2000 \
            --event-window-ms 2000 \
            --min-large-usd 1000 \
            --max-market-pages 50 \
            --only-two-sided \
            --output-dir research/output/arb_bot_events/raw
      - name: Build larger trigger candidate pool
        run: |
          python research/arb_bot_event_report.py \
            --input-dir research/output/arb_bot_events/raw \
            --output-dir research/output/arb_bot_events/candidates \
            --top-events 20 \
            --min-trigger-usd 1000
      - name: Resolve all candidate Solana chain order
        run: |
          if [ -z "$HELIUS_API_KEY" ]; then
            echo "HELIUS_API_KEY secret is required for chain-order enrichment."
            exit 1
          fi
          python research/arb_bot_chain_order.py \
            --input-dir research/output/arb_bot_events/candidates \
            --output-dir research/output/arb_bot_events/candidates/chain_order
      - name: Select confirmed top 10 trigger events
        run: |
          python research/arb_bot_confirmed_events.py \
            --input-dir research/output/arb_bot_events/candidates/chain_order \
            --output-dir research/output/arb_bot_events/confirmed_top10 \
            --top-events 10 \
            --min-trigger-usd 1000
      - name: Show confirmed top 10
        if: always()
        run: |
          echo '=== candidate chain meta ==='
          cat research/output/arb_bot_events/candidates/chain_order/chain_order_meta.json || true
          echo '=== confirmed_events_summary.csv ==='
          cat research/output/arb_bot_events/confirmed_top10/confirmed_events_summary.csv || true
          echo '=== confirmed event blocks (first 220 lines) ==='
          head -n 220 research/output/arb_bot_events/confirmed_top10/confirmed_event_blocks.md || true
      - name: Upload event study output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arb-bot-confirmed-top10
          path: research/output/arb_bot_events/
          if-no-files-found: warn
