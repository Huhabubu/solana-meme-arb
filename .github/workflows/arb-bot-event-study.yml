name: Arb Bot Event Study

on:
  workflow_dispatch:
  push:
    paths:
      - "research/arb_bot_event_study.py"
      - "research/arb_bot_event_report.py"
      - "research/arb_bot_event_blocks.py"
      - "research/arb_bot_chain_order.py"
      - ".github/workflows/arb-bot-event-study.yml"

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: |
          python -m py_compile research/arb_bot_event_study.py
          python -m py_compile research/arb_bot_event_report.py
          python -m py_compile research/arb_bot_event_blocks.py
          python -m py_compile research/arb_bot_chain_order.py
      - name: Run live candidate scan
        run: |
          python research/arb_bot_event_study.py \
            --mint-limit 20 \
            --bot-history-rows 300 \
            --arb-events-per-mint 5 \
            --search-window-ms 2000 \
            --event-window-ms 2000 \
            --min-large-usd 1000 \
            --max-market-pages 50 \
            --only-two-sided \
            --output-dir research/output/arb_bot_events
      - name: Build trigger-centered top 10 report
        run: |
          python research/arb_bot_event_report.py \
            --input-dir research/output/arb_bot_events \
            --output-dir research/output/arb_bot_events/top10 \
            --top-events 10
      - name: Build chronological event blocks
        run: |
          python research/arb_bot_event_blocks.py \
            --input-dir research/output/arb_bot_events/top10 \
            --output-dir research/output/arb_bot_events/top10/blocks
      - name: Resolve Solana chain order
        run: |
          if [ -z "$HELIUS_API_KEY" ]; then
            echo "HELIUS_API_KEY secret is required for chain-order enrichment."
            exit 1
          fi
          python research/arb_bot_chain_order.py \
            --input-dir research/output/arb_bot_events/top10 \
            --output-dir research/output/arb_bot_events/top10/chain_order
      - name: Show chain-order event summary
        if: always()
        run: |
          echo '=== chain_order_meta.json ==='
          cat research/output/arb_bot_events/top10/chain_order/chain_order_meta.json || true
          echo '=== event_chain_summary.csv ==='
          cat research/output/arb_bot_events/top10/chain_order/event_chain_summary.csv || true
          echo '=== chain ordered blocks (first 180 lines) ==='
          head -n 180 research/output/arb_bot_events/top10/chain_order/event_blocks_chain_ordered.md || true
      - name: Upload event study output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arb-bot-event-study-chain-order
          path: research/output/arb_bot_events/
          if-no-files-found: warn
