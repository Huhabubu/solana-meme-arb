name: ci

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/**"

# 同一分支快速连续提交时，只保留最新一次 CI，避免旧提交继续消耗 Actions 时间。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy

      - name: Resolve Rust cache key
        id: rust-version
        run: echo "version=$(rustc --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # 缓存 Cargo 下载目录与 target。key 同时绑定 Rust 版本、Cargo.toml 和 Cargo.lock；
      # 依赖或编译器变化时生成新缓存，restore-key 只用于复用仍然兼容的旧产物。
      - name: Restore Cargo cache
        id: cargo-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ steps.rust-version.outputs.version }}-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ steps.rust-version.outputs.version }}-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Compile check
        run: cargo check --all-targets

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --all-targets

      # V0 端到端冒烟测试：真实请求 DEX 公共 API，不使用钱包或密钥。
      - name: Live pool discovery
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        timeout-minutes: 2
        run: cargo run -- discover

      # 再从 Solana Mainnet 读取候选 Pool Account，核验账户存在且 owner 等于预期 DEX Program。
      - name: Live on-chain verification
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        timeout-minutes: 2
        run: cargo run -- verify

      # V1 必须使用 GitHub Actions Secret 注入 Helius Key；Secret 缺失时明确跳过，不能伪装成已验证。
      - name: Live Helius HTTP and WSS verification
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        timeout-minutes: 2
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: |
          if [ -z "$HELIUS_API_KEY" ]; then
            echo "HELIUS_API_KEY secret is not configured; V1 live verification skipped."
            exit 0
          fi
          cargo run -- helius-check

      # V2 Raydium 子模块：真实读取 AMM v4 Pool State 与两个 vault，并用本地数学计算报价。
      - name: Live Raydium AMM v4 local quote verification
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        timeout-minutes: 2
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: |
          if [ -z "$HELIUS_API_KEY" ]; then
            echo "HELIUS_API_KEY secret is not configured; V2 Raydium live verification skipped."
            exit 0
          fi
          cargo run -- raydium-quote-check

      # V2 Orca 子模块：真实读取 Whirlpool、TickArray、Mint 和可选 Oracle，并调用 Orca 官方 core 报价引擎。
      - name: Live Orca Whirlpool local quote verification
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        timeout-minutes: 2
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: |
          if [ -z "$HELIUS_API_KEY" ]; then
            echo "HELIUS_API_KEY secret is not configured; V2 Orca live verification skipped."
            exit 0
          fi
          cargo run -- orca-quote-check

      # V2 Meteora 子模块：真实读取 LbPair、Clock、Mint、bitmap extension 和当前方向 BinArray，调用官方 Rust quote。
      - name: Live Meteora DLMM local quote verification
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        timeout-minutes: 2
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: |
          if [ -z "$HELIUS_API_KEY" ]; then
            echo "HELIUS_API_KEY secret is not configured; V2 Meteora live verification skipped."
            exit 0
          fi
          cargo run -- meteora-quote-check

      # V3：三个已支持 DEX 的全部有向两池路径；每条路径用同一腿快照测试多个输入金额并应用成本模型。
      - name: Live V3 all-DEX multi-size round-trip verification
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        timeout-minutes: 3
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: |
          if [ -z "$HELIUS_API_KEY" ]; then
            echo "HELIUS_API_KEY secret is not configured; V3 multi-size round-trip verification skipped."
            exit 0
          fi
          cargo run -- round-trip-check

      # V3.5/V3.6：真实 WSS update → affected Pool Context → related routes → OpportunityEvent；
      # 同一步把事件追加写到临时 JSONL，再由程序重读并汇总，验证持久化链路。
      - name: Live V3 dependency-triggered opportunity and persistence verification
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        timeout-minutes: 4
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          OPPORTUNITY_LOG_PATH: ${{ runner.temp }}/opportunity-events.jsonl
        run: |
          if [ -z "$HELIUS_API_KEY" ]; then
            echo "HELIUS_API_KEY secret is not configured; V3.6 opportunity persistence verification skipped."
            exit 0
          fi
          rm -f "$OPPORTUNITY_LOG_PATH"
          cargo run -- opportunity-wss-check
          test -s "$OPPORTUNITY_LOG_PATH"
          echo "V3.6 JSONL line count: $(wc -l < "$OPPORTUNITY_LOG_PATH")"

      # V3.6.2：同一个进程/同一个 WSS session 连续处理至少 2 条真实账户更新。
      # 最终日志必须证明两条都在同一 session 内完成，并持续追加到同一个 JSONL。
      - name: Live V3.6.2 continuous opportunity monitor verification
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        timeout-minutes: 4
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          OPPORTUNITY_LOG_PATH: ${{ runner.temp }}/opportunity-monitor.jsonl
          OPPORTUNITY_MONITOR_UPDATES: "2"
          OPPORTUNITY_MONITOR_MAX_SECONDS: "120"
          OPPORTUNITY_MONITOR_UPDATE_TIMEOUT_SECONDS: "45"
          OPPORTUNITY_MONITOR_MAX_RECONNECTS: "2"
        run: |
          if [ -z "$HELIUS_API_KEY" ]; then
            echo "HELIUS_API_KEY secret is not configured; V3.6.2 continuous monitor verification skipped."
            exit 0
          fi
          rm -f "$OPPORTUNITY_LOG_PATH"
          cargo run -- opportunity-monitor 2>&1 | tee "$RUNNER_TEMP/opportunity-monitor.log"
          test -s "$OPPORTUNITY_LOG_PATH"
          grep -q 'processed_updates=2' "$RUNNER_TEMP/opportunity-monitor.log"
          grep -q 'max_updates_in_single_session=2' "$RUNNER_TEMP/opportunity-monitor.log"
          echo "V3.6.2 continuous JSONL line count: $(wc -l < "$OPPORTUNITY_LOG_PATH")"
