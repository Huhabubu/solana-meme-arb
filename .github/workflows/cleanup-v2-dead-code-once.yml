name: cleanup-v2-dead-code-once

on:
  push:
    paths:
      - '.github/workflows/cleanup-v2-dead-code-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove stale tests for deleted production helpers
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/state.rs')
          text = path.read_text()

          pattern = r'\n    #\[test\]\n    fn dependency_kind_is_marked_as_quote_trigger\(\) \{\n(?:        .*\n)+?    \}\n'
          text, count = re.subn(pattern, '\n', text, count=1)
          if count != 1:
              raise SystemExit(f'trigger test removal count={count}')

          old = 'state.account("vault").unwrap().data'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'account assertion count={count}')
          text = text.replace(old, 'state.account_data.get("vault").unwrap().data')

          path.write_text(text)
          PY
          cargo fmt --all

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/state.rs
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "test: align V2 state tests with production API"
          git push
