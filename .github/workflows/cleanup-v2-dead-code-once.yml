name: cleanup-v2-dead-code-once

on:
  push:
    paths:
      - '.github/workflows/cleanup-v2-dead-code-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove confirmed unused production code
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('src/app.rs')
          text = app.read_text()
          old = '    collections::{HashMap, HashSet},'
          if text.count(old) != 1:
              raise SystemExit(f'app HashMap import count={text.count(old)}')
          app.write_text(text.replace(old, '    collections::HashSet,', 1))

          state = Path('src/state.rs')
          text = state.read_text()

          impl_block = '''impl DependencyKind {
              pub fn is_dynamic_quote_trigger(self) -> bool {
                  matches!(
                      self,
                      Self::PoolState
                          | Self::TokenVault
                          | Self::TickArray
                          | Self::Oracle
                          | Self::BinArray
                          | Self::BitmapExtension
                          | Self::TokenMint
                  )
              }
          }

          '''
          if text.count(impl_block) != 1:
              raise SystemExit(f'DependencyKind impl count={text.count(impl_block)}')
          text = text.replace(impl_block, '', 1)

          trigger_test = '''    #[test]
              fn dependency_kind_is_marked_as_quote_trigger() {
                  assert!(DependencyKind::TokenVault.is_dynamic_quote_trigger());
                  assert!(DependencyKind::BinArray.is_dynamic_quote_trigger());
              }

          '''
          if text.count(trigger_test) != 1:
              raise SystemExit(f'trigger test count={text.count(trigger_test)}')
          text = text.replace(trigger_test, '', 1)

          account_method = '''    pub fn account(&self, address: &str) -> Option<&VersionedAccountData> {
                  self.account_data.get(address)
              }

          '''
          if text.count(account_method) != 1:
              raise SystemExit(f'account method count={text.count(account_method)}')
          account_test_only = '''    #[cfg(test)]
              fn account(&self, address: &str) -> Option<&VersionedAccountData> {
                  self.account_data.get(address)
              }

          '''
          text = text.replace(account_method, account_test_only, 1)
          state.write_text(text)
          PY
          cargo fmt --all

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.rs src/state.rs
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "fix: remove unused V2 production code"
          git push
