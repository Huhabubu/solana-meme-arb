name: cleanup-v2-dead-code-once

on:
  push:
    paths:
      - '.github/workflows/cleanup-v2-dead-code-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove stale tests for deleted production helpers
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/state.rs')
          text = path.read_text()

          trigger_test = '''    #[test]
          fn dependency_kind_is_marked_as_quote_trigger() {
              assert!(DependencyKind::TokenVault.is_dynamic_quote_trigger());
              assert!(DependencyKind::BinArray.is_dynamic_quote_trigger());
          }

          '''
          if text.count(trigger_test) != 1:
              raise SystemExit(f'trigger test count={text.count(trigger_test)}')
          text = text.replace(trigger_test, '', 1)

          old = 'state.account("vault").unwrap().data'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'account assertion count={count}')
          text = text.replace(old, 'state.account_data.get("vault").unwrap().data')

          path.write_text(text)
          PY
          cargo fmt --all

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/state.rs
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "test: align V2 state tests with production API"
          git push
