name: clippy-fix

on:
  push:
    branches:
      - agent/event-driven-monitor-v1

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/event-driven-monitor-v1

      - name: Fix useless timestamp conversion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/dynamic_quote.rs')
          text = path.read_text()
          old = '''fn unix_timestamp() -> Result<u64> {
    SystemTime::now()
        .duration_since(UNIX_EPOCH)
        .context("system clock is before Unix epoch")?
        .as_secs()
        .try_into()
        .context("Unix timestamp does not fit u64")
}
'''
          new = '''fn unix_timestamp() -> Result<u64> {
    Ok(SystemTime::now()
        .duration_since(UNIX_EPOCH)
        .context("system clock is before Unix epoch")?
        .as_secs())
}
'''
          if old not in text:
              raise SystemExit('expected unix_timestamp block not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Apply rustfmt
        run: cargo fmt --all

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dynamic_quote.rs
          git commit -m "fix: satisfy clippy timestamp conversion"
          git push origin HEAD:agent/event-driven-monitor-v1
