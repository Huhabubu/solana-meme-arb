name: clippy-fix

on:
  push:
    branches:
      - agent/event-driven-monitor-v1

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/event-driven-monitor-v1

      - name: Fix useless timestamp conversion
        run: |
          python3 -c 'from pathlib import Path; p=Path("src/dynamic_quote.rs"); s=p.read_text(); old="        .as_secs()\n        .try_into()\n        .context(\"Unix timestamp does not fit u64\")"; new="        .as_secs()"; assert old in s, "expected clippy block not found"; s=s.replace(old,new,1); s=s.replace("fn unix_timestamp() -> Result<u64> {\n    SystemTime::now()", "fn unix_timestamp() -> Result<u64> {\n    Ok(SystemTime::now()", 1); s=s.replace("        .as_secs()\n}", "        .as_secs())\n}", 1); p.write_text(s)'

      - name: Apply rustfmt
        run: cargo fmt --all

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dynamic_quote.rs
          git commit -m "fix: satisfy clippy timestamp conversion"
          git push origin HEAD:agent/event-driven-monitor-v1
