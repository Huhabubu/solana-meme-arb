name: event-live-smoke

on:
  push:
    branches:
      - agent/event-driven-monitor-v1

jobs:
  fail-fast-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
      EVENT_LOG_PATH: /tmp/event-driven-v2.jsonl
      EVENT_MONITOR_MAX_EVENTS: "1"
      EVENT_MONITOR_MAX_SECONDS: "30"
      EVENT_MONITOR_UPDATE_TIMEOUT_SECONDS: "10"
      EVENT_MONITOR_MAX_RECONNECTS: "3"
      EVENT_MIN_WSOL_LAMPORTS: "0"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Require Helius key
        run: test -n "$HELIUS_API_KEY"

      - name: Install stable Rust
        run: |
          rustup update stable
          rustup default stable

      - name: Resolve Rust cache key
        id: rust-version
        run: echo "version=$(rustc --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Restore Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ steps.rust-version.outputs.version }}-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ steps.rust-version.outputs.version }}-

      - name: Verify exhausted credits fail immediately
        run: |
          set +e
          cargo run -- opportunity-monitor 2>&1 | tee "$RUNNER_TEMP/event-live-smoke.log"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -q 'Event-driven V2 started:.*fixed_mints=0' "$RUNNER_TEMP/event-live-smoke.log"
          grep -q 'Helius WSS usage exhausted' "$RUNNER_TEMP/event-live-smoke.log"
          grep -q 'max usage reached' "$RUNNER_TEMP/event-live-smoke.log"
          if grep -q 'WSS reconnect #' "$RUNNER_TEMP/event-live-smoke.log"; then
            echo 'unexpected reconnect after permanent Helius usage exhaustion'
            exit 1
          fi

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-live-smoke-fail-fast
          path: ${{ runner.temp }}/event-live-smoke.log
          if-no-files-found: warn
          retention-days: 3
