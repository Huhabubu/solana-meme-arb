name: event-v3-upgrade-and-smoke

on:
  push:
    branches:
      - agent/event-driven-monitor-v2
    paths:
      - .github/workflows/event-v3-upgrade-and-smoke.yml

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout event branch
        uses: actions/checkout@v7
        with:
          ref: agent/event-driven-monitor-v2
          fetch-depth: 0

      - name: Apply Large Swap Event Study V1 schema
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/event_monitor_v2.rs")
          s = path.read_text()
          if 'const EVENT_SCHEMA: &str = "large-swap-event-v1";' in s:
              print("large-swap schema already applied")
              raise SystemExit(0)

          def rep(old, new, count=1):
              global s
              found = s.count(old)
              if found < count:
                  raise SystemExit(f"patch anchor missing: expected >= {count}, found {found}: {old[:120]!r}")
              s = s.replace(old, new, count)

          rep('const EVENT_SCHEMA: &str = "event-driven-v2";',
              'const EVENT_SCHEMA: &str = "large-swap-event-v1";')

          rep('''    second_dex: String,\n    second_pool: String,\n    input_lamports: u64,''',
              '''    second_dex: String,\n    second_pool: String,\n    route_contains_trigger_pool: Option<bool>,\n    input_lamports: u64,''')

          rep('''                second_dex: event.second_dex.to_string(),\n                second_pool: event.second_pool.clone(),\n                input_lamports: event.input_amount,''',
              '''                second_dex: event.second_dex.to_string(),\n                second_pool: event.second_pool.clone(),\n                route_contains_trigger_pool: None,\n                input_lamports: event.input_amount,''', count=1)
          rep('''                second_dex: event.second_dex.to_string(),\n                second_pool: event.second_pool.clone(),\n                input_lamports: event.input_amount,''',
              '''                second_dex: event.second_dex.to_string(),\n                second_pool: event.second_pool.clone(),\n                route_contains_trigger_pool: None,\n                input_lamports: event.input_amount,''', count=1)

          rep('''    event_slot: u64,\n    trigger_program: String,\n    source: String,''',
              '''    event_slot: u64,\n    trigger_program: String,\n    trigger_dex: Option<&'static str>,\n    trigger_pool: Option<String>,\n    trigger_pool_match_count: usize,\n    source: String,''')

          rep('''    token_amount_raw: Option<u64>,\n    pool_discovery_ok: bool,''',
              '''    token_amount_raw: Option<u64>,\n    trigger_received_at_unix_ms: u64,\n    tx_parsed_at_unix_ms: u64,\n    pool_discovery_done_at_unix_ms: u64,\n    quote_done_at_unix_ms: u64,\n    parse_ms: u64,\n    total_event_to_quote_ms: u64,\n    pool_discovery_ok: bool,''')

          helper = r'''
fn transaction_account_keys(transaction: &Value) -> HashSet<String> {
    transaction
        .get("accountData")
        .and_then(Value::as_array)
        .into_iter()
        .flatten()
        .filter_map(|entry| entry.get("account").and_then(Value::as_str))
        .map(str::to_owned)
        .collect()
}

fn trigger_dex_for_program(program_id: &str) -> Option<&'static str> {
    match program_id {
        RAYDIUM_AMM_V4_PROGRAM_ID => Some("raydium"),
        ORCA_WHIRLPOOL_PROGRAM_ID => Some("orca"),
        DLMM_PROGRAM_ID => Some("meteora_dlmm"),
        _ => None,
    }
}

fn resolve_trigger_pool(transaction: &Value, pools: &[PoolInfo]) -> (Option<String>, usize) {
    let accounts = transaction_account_keys(transaction);
    let matches = pools
        .iter()
        .filter(|pool| accounts.contains(&pool.address))
        .collect::<Vec<_>>();
    let count = matches.len();
    let resolved = (count == 1).then(|| matches[0].address.clone());
    (resolved, count)
}

'''
          rep('fn is_supported_quote_pool(pool: &PoolInfo) -> bool {',
              helper + 'fn is_supported_quote_pool(pool: &PoolInfo) -> bool {')

          rep('''fn summarize_opportunities(\n    events: &[OpportunityEvent],\n) -> (''',
              '''fn summarize_opportunities(\n    events: &[OpportunityEvent],\n    trigger_pool: Option<&str>,\n) -> (''')

          rep('''        events.iter().map(OpportunityRecord::from).collect(),\n    )\n}''',
              '''        events\n            .iter()\n            .map(|event| {\n                let mut record = OpportunityRecord::from(event);\n                record.route_contains_trigger_pool = trigger_pool.map(|pool| {\n                    event.first_pool.as_str() == pool || event.second_pool.as_str() == pool\n                });\n                record\n            })\n            .collect(),\n    )\n}''')

          rep('''            if !deduper.insert(&trigger.signature) {\n                duplicate_signatures += 1;\n                continue;\n            }\n\n            let parsed = match fetch_enhanced_transaction(''',
              '''            if !deduper.insert(&trigger.signature) {\n                duplicate_signatures += 1;\n                continue;\n            }\n\n            let event_started = Instant::now();\n            let trigger_received_at_unix_ms = unix_timestamp_millis()?;\n            let parse_started = Instant::now();\n            let parsed = match fetch_enhanced_transaction(''')

          rep('''            let Some(event) = parse_direct_wsol_swap(&parsed, &trigger)? else {\n                non_direct_swaps += 1;\n                continue;\n            };\n            if monitor_config.min_wsol_lamports > 0 {''',
              '''            let Some(event) = parse_direct_wsol_swap(&parsed, &trigger)? else {\n                non_direct_swaps += 1;\n                continue;\n            };\n            let parse_ms =\n                u64::try_from(parse_started.elapsed().as_millis()).unwrap_or(u64::MAX);\n            let tx_parsed_at_unix_ms = unix_timestamp_millis()?;\n            if monitor_config.min_wsol_lamports > 0 {''')

          rep('''            let pool_discovery_ms =\n                u64::try_from(discovery_started.elapsed().as_millis()).unwrap_or(u64::MAX);\n\n            let quote_started = Instant::now();''',
              '''            let pool_discovery_ms =\n                u64::try_from(discovery_started.elapsed().as_millis()).unwrap_or(u64::MAX);\n            let pool_discovery_done_at_unix_ms = unix_timestamp_millis()?;\n            let trigger_dex = trigger_dex_for_program(&event.trigger_program);\n            let (trigger_pool, trigger_pool_match_count) = resolve_trigger_pool(&parsed, &pools);\n\n            let quote_started = Instant::now();''')

          rep('''            let quote_eval_ms =\n                u64::try_from(quote_started.elapsed().as_millis()).unwrap_or(u64::MAX);\n            let (evaluated_count, net_positive_count, best_profit, best_return, opportunities) =\n                summarize_opportunities(&opportunity_events);''',
              '''            let quote_eval_ms =\n                u64::try_from(quote_started.elapsed().as_millis()).unwrap_or(u64::MAX);\n            let quote_done_at_unix_ms = unix_timestamp_millis()?;\n            let total_event_to_quote_ms =\n                u64::try_from(event_started.elapsed().as_millis()).unwrap_or(u64::MAX);\n            let (evaluated_count, net_positive_count, best_profit, best_return, opportunities) =\n                summarize_opportunities(&opportunity_events, trigger_pool.as_deref());''')

          rep('''                event_slot: event.slot,\n                trigger_program: event.trigger_program.clone(),\n                source: event.source.clone(),''',
              '''                event_slot: event.slot,\n                trigger_program: event.trigger_program.clone(),\n                trigger_dex,\n                trigger_pool: trigger_pool.clone(),\n                trigger_pool_match_count,\n                source: event.source.clone(),''')

          rep('''                wsol_amount_lamports: event.wsol_amount_lamports,\n                token_amount_raw: event.token_amount_raw,\n                pool_discovery_ok,''',
              '''                wsol_amount_lamports: event.wsol_amount_lamports,\n                token_amount_raw: event.token_amount_raw,\n                trigger_received_at_unix_ms,\n                tx_parsed_at_unix_ms,\n                pool_discovery_done_at_unix_ms,\n                quote_done_at_unix_ms,\n                parse_ms,\n                total_event_to_quote_ms,\n                pool_discovery_ok,''')

          rep('''                "Event-driven V2 event #{accepted_events}: event_slot={} quote_slot={:?} mint={} direction={:?} wsol_lamports={:?} pools={} routes={} evaluated={} net_positive={} best_net_lamports={:?} discovery_ms={} quote_ms={} signature={}",\n                event.slot,\n                quote_snapshot_slot,\n                event.token_mint,''',
              '''                "Event-driven V2 event #{accepted_events}: event_slot={} quote_slot={:?} mint={} direction={:?} wsol_lamports={:?} trigger_pool={:?} pools={} routes={} evaluated={} net_positive={} best_net_lamports={:?} parse_ms={} discovery_ms={} quote_ms={} total_ms={} signature={}",\n                event.slot,\n                quote_snapshot_slot,\n                event.token_mint,''')

          rep('''                event.wsol_amount_lamports,\n                pools.len(),\n                route_count,''',
              '''                event.wsol_amount_lamports,\n                trigger_pool,\n                pools.len(),\n                route_count,''')

          rep('''                best_profit,\n                pool_discovery_ms,\n                quote_eval_ms,\n                event.signature''',
              '''                best_profit,\n                parse_ms,\n                pool_discovery_ms,\n                quote_eval_ms,\n                total_event_to_quote_ms,\n                event.signature''')

          test = r'''

    #[test]
    fn resolves_trigger_pool_from_enhanced_account_data() {
        let transaction = json!({
            "accountData": [
                {"account": "user"},
                {"account": "ray-trigger"},
                {"account": "vault"}
            ]
        });
        let pools = vec![PoolInfo {
            dex: Dex::Raydium,
            address: "ray-trigger".into(),
            pool_type: "Standard".into(),
            program_id: Some(RAYDIUM_AMM_V4_PROGRAM_ID.into()),
            mint_a: "M".into(),
            mint_b: WSOL.into(),
            tvl_usd: 10_000.0,
        }];
        let (pool, count) = resolve_trigger_pool(&transaction, &pools);
        assert_eq!(pool.as_deref(), Some("ray-trigger"));
        assert_eq!(count, 1);
        assert_eq!(trigger_dex_for_program(RAYDIUM_AMM_V4_PROGRAM_ID), Some("raydium"));
    }
'''
          rep('\n    #[test]\n    fn signature_deduper_is_bounded() {',
              test + '\n    #[test]\n    fn signature_deduper_is_bounded() {')

          path.write_text(s)
          PY

      - name: Update live smoke schema assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path(".github/workflows/event-live-smoke.yml")
          s = path.read_text()
          s = s.replace('EVENT_LOG_PATH: /tmp/event-driven-v2.jsonl', 'EVENT_LOG_PATH: /tmp/large-swap-event-v1.jsonl')
          s = s.replace('assert row["schema"] == "event-driven-v2"', 'assert row["schema"] == "large-swap-event-v1"')
          anchor = '          assert row["event_slot"] > 0\n'
          extra = '''          assert row["event_slot"] > 0\n          assert row["trigger_dex"] in {"raydium", "orca", "meteora_dlmm"}\n          assert row["trigger_received_at_unix_ms"] <= row["tx_parsed_at_unix_ms"] <= row["pool_discovery_done_at_unix_ms"] <= row["quote_done_at_unix_ms"]\n          assert row["total_event_to_quote_ms"] >= row["parse_ms"]\n          assert row["trigger_pool_match_count"] >= 0\n          candidate_addresses = {pool["address"] for pool in row["candidate_pools"]}\n          if row["trigger_pool"] is not None:\n              assert row["trigger_pool_match_count"] == 1\n              assert row["trigger_pool"] in candidate_addresses\n          for opp in row["opportunities"]:\n              expected = None if row["trigger_pool"] is None else (\n                  opp["first_pool"] == row["trigger_pool"] or opp["second_pool"] == row["trigger_pool"]\n              )\n              assert opp["route_contains_trigger_pool"] == expected\n'''
          if anchor not in s:
              raise SystemExit("smoke assertion anchor missing")
          s = s.replace(anchor, extra, 1)
          s = s.replace('/tmp/event-driven-v2.jsonl', '/tmp/large-swap-event-v1.jsonl')
          path.write_text(s)
          PY

      - name: Format and test
        run: |
          cargo fmt --all -- --check || cargo fmt --all
          cargo fmt --all -- --check
          cargo check --all-targets --locked
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --all-targets --locked

      - name: Commit upgraded event schema
        run: |
          if git diff --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/event_monitor_v2.rs .github/workflows/event-live-smoke.yml
          git commit -m "feat: attribute large swaps to trigger pools"
          git push origin HEAD:agent/event-driven-monitor-v2

  live-smoke:
    needs: upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HELIUS_API_KEY_V2: ${{ secrets.HELIUS_API_KEY_V2 }}
      EVENT_LOG_PATH: /tmp/large-swap-event-v1.jsonl
      EVENT_MONITOR_MAX_EVENTS: "1"
      EVENT_MONITOR_MAX_SECONDS: "240"
      EVENT_MONITOR_UPDATE_TIMEOUT_SECONDS: "45"
      EVENT_MONITOR_MAX_RECONNECTS: "3"
      EVENT_MIN_WSOL_LAMPORTS: "0"
    steps:
      - name: Checkout upgraded branch head
        uses: actions/checkout@v7
        with:
          ref: agent/event-driven-monitor-v2

      - name: Require Helius V2 key
        run: test -n "$HELIUS_API_KEY_V2"

      - name: Install stable Rust
        run: |
          rustup update stable
          rustup default stable

      - name: Run one live dynamic swap event
        run: |
          rm -f "$EVENT_LOG_PATH"
          cargo run --locked -- opportunity-monitor 2>&1 | tee "$RUNNER_TEMP/event-v3-live.log"
          grep -q 'Event-driven V2 started:.*fixed_mints=0' "$RUNNER_TEMP/event-v3-live.log"
          grep -q 'Event-driven V2 completed: accepted_events=1' "$RUNNER_TEMP/event-v3-live.log"
          test -s "$EVENT_LOG_PATH"

      - name: Validate Large Swap Event V1 record
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          row = json.loads(Path(os.environ["EVENT_LOG_PATH"]).read_text().splitlines()[0])
          assert row["schema"] == "large-swap-event-v1"
          assert row["event_slot"] > 0
          assert row["trigger_dex"] in {"raydium", "orca", "meteora_dlmm"}
          assert row["trigger_received_at_unix_ms"] <= row["tx_parsed_at_unix_ms"] <= row["pool_discovery_done_at_unix_ms"] <= row["quote_done_at_unix_ms"]
          assert row["total_event_to_quote_ms"] >= row["parse_ms"]
          if row["trigger_pool"] is not None:
              assert row["trigger_pool_match_count"] == 1
              assert row["trigger_pool"] in {p["address"] for p in row["candidate_pools"]}
          for opp in row["opportunities"]:
              expected = None if row["trigger_pool"] is None else (opp["first_pool"] == row["trigger_pool"] or opp["second_pool"] == row["trigger_pool"])
              assert opp["route_contains_trigger_pool"] == expected
          print(json.dumps({
              "schema": row["schema"],
              "signature": row["signature"],
              "event_slot": row["event_slot"],
              "trigger_dex": row["trigger_dex"],
              "trigger_pool": row["trigger_pool"],
              "wsol_amount_lamports": row["wsol_amount_lamports"],
              "candidate_pool_count": row["candidate_pool_count"],
              "route_count": row["route_count"],
              "net_positive_count": row["net_positive_count"],
              "parse_ms": row["parse_ms"],
              "pool_discovery_ms": row["pool_discovery_ms"],
              "quote_eval_ms": row["quote_eval_ms"],
              "total_event_to_quote_ms": row["total_event_to_quote_ms"],
          }, ensure_ascii=False))
          PY

      - name: Upload live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-v3-live-smoke
          path: |
            ${{ runner.temp }}/event-v3-live.log
            /tmp/large-swap-event-v1.jsonl
          if-no-files-found: warn
          retention-days: 3
