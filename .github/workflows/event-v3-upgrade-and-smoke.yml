name: event-v3-upgrade-and-smoke

on:
  push:
    branches:
      - agent/event-driven-monitor-v2
    paths:
      - .github/workflows/event-v3-upgrade-and-smoke.yml
      - .github/scripts/apply_large_swap_schema.py

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout event branch
        uses: actions/checkout@v7
        with:
          ref: agent/event-driven-monitor-v2
          fetch-depth: 0

      - name: Apply previously validated Large Swap Event V1 schema
        run: python3 .github/scripts/apply_large_swap_schema.py

      - name: Format check
        run: |
          cargo fmt --all
          cargo fmt --all -- --check

      - name: Commit upgraded event source
        run: |
          if git diff --quiet -- src/event_monitor_v2.rs; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/event_monitor_v2.rs
          git commit -m "feat: attribute large swaps to trigger pools"
          git push origin HEAD:agent/event-driven-monitor-v2

  live-smoke:
    needs: upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HELIUS_API_KEY_V2: ${{ secrets.HELIUS_API_KEY_V2 }}
      EVENT_LOG_PATH: /tmp/large-swap-event-v1.jsonl
      EVENT_MONITOR_MAX_EVENTS: "1"
      EVENT_MONITOR_MAX_SECONDS: "240"
      EVENT_MONITOR_UPDATE_TIMEOUT_SECONDS: "45"
      EVENT_MONITOR_MAX_RECONNECTS: "3"
      EVENT_MIN_WSOL_LAMPORTS: "0"
    steps:
      - name: Checkout upgraded branch head
        uses: actions/checkout@v7
        with:
          ref: agent/event-driven-monitor-v2

      - name: Require Helius V2 key
        run: test -n "$HELIUS_API_KEY_V2"

      - name: Install stable Rust
        run: |
          rustup update stable
          rustup default stable

      - name: Run one live dynamic swap event
        run: |
          rm -f "$EVENT_LOG_PATH"
          cargo run --locked -- opportunity-monitor 2>&1 | tee "$RUNNER_TEMP/event-v3-live.log"
          grep -q 'Event-driven V2 started:.*fixed_mints=0' "$RUNNER_TEMP/event-v3-live.log"
          grep -q 'Event-driven V2 completed: accepted_events=1' "$RUNNER_TEMP/event-v3-live.log"
          test -s "$EVENT_LOG_PATH"

      - name: Validate Large Swap Event V1 record
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          row = json.loads(Path(os.environ["EVENT_LOG_PATH"]).read_text().splitlines()[0])
          assert row["schema"] == "large-swap-event-v1"
          assert row["event_slot"] > 0
          assert row["trigger_dex"] in {"raydium", "orca", "meteora_dlmm"}
          assert row["trigger_received_at_unix_ms"] <= row["tx_parsed_at_unix_ms"] <= row["pool_discovery_done_at_unix_ms"] <= row["quote_done_at_unix_ms"]
          assert row["total_event_to_quote_ms"] >= row["parse_ms"]
          if row["trigger_pool"] is not None:
              assert row["trigger_pool_match_count"] == 1
              assert row["trigger_pool"] in {p["address"] for p in row["candidate_pools"]}
          for opp in row["opportunities"]:
              expected = None if row["trigger_pool"] is None else (opp["first_pool"] == row["trigger_pool"] or opp["second_pool"] == row["trigger_pool"])
              assert opp["route_contains_trigger_pool"] == expected
          print(json.dumps({
              "schema": row["schema"],
              "signature": row["signature"],
              "event_slot": row["event_slot"],
              "trigger_dex": row["trigger_dex"],
              "trigger_pool": row["trigger_pool"],
              "wsol_amount_lamports": row["wsol_amount_lamports"],
              "candidate_pool_count": row["candidate_pool_count"],
              "route_count": row["route_count"],
              "net_positive_count": row["net_positive_count"],
              "parse_ms": row["parse_ms"],
              "pool_discovery_ms": row["pool_discovery_ms"],
              "quote_eval_ms": row["quote_eval_ms"],
              "total_event_to_quote_ms": row["total_event_to_quote_ms"],
          }, ensure_ascii=False))
          PY

      - name: Upload live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-v3-live-smoke
          path: |
            ${{ runner.temp }}/event-v3-live.log
            /tmp/large-swap-event-v1.jsonl
          if-no-files-found: warn
          retention-days: 3
