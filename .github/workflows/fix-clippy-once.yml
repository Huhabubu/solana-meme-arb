name: fix-clippy-once

on:
  push:
    paths:
      - '.github/workflows/fix-clippy-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply confirmed Clippy fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app.rs')
          text = path.read_text()
          old = 'zip(batch.accounts.into_iter())'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected exactly 2 confirmed Clippy occurrences, found {count}')
          path.write_text(text.replace(old, 'zip(batch.accounts)'))
          PY
          cargo fmt --all

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.rs
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "fix: address V2 Clippy iterator warnings"
          git push
