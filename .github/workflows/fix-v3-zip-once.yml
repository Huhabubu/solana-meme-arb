name: fix-v3-zip-once

on:
  push:
    paths:
      - '.github/workflows/fix-v3-zip-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove redundant zip conversions
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('src/app.rs')
          text = path.read_text()
          for old, new in [
              ('.zip(first_available.into_iter())', '.zip(first_available)'),
              ('.zip(second_points.into_iter())', '.zip(second_points)'),
          ]:
              if text.count(old) != 1:
                  raise SystemExit(f'expected one match for {old!r}, got {text.count(old)}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.rs
          git diff --cached --quiet && { echo "No changes produced"; exit 1; }
          git commit -m "fix: remove redundant V3 zip conversions"
          git push
