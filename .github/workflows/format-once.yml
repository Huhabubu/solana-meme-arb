name: format-once

on:
  push:
    paths:
      - '.github/workflows/format-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust and rustfmt
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt

      - name: Apply rustfmt
        run: cargo fmt --all

      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "rustfmt produced no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "style: apply rustfmt to current V2 sources"
          git push
