name: generate-cargo-lock-once

on:
  push:
    paths:
      - '.github/workflows/generate-cargo-lock-once.yml'

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use stable Rust
        run: |
          rustup update stable
          rustup default stable

      - name: Generate Cargo.lock
        run: cargo generate-lockfile

      - name: Commit Cargo.lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git diff --cached --quiet && { echo "Cargo.lock was not generated or changed"; exit 1; }
          git commit -m "build: pin Rust dependency lockfile"
          git push
