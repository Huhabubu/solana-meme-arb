name: harden-min-context-once

on:
  push:
    paths:
      - ".github/workflows/harden-min-context.yml"

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Install Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
      - name: Restore Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-min-context-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Apply guarded source patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected 1 match, got {count}')
              return text.replace(old, new, 1)

          rpc = Path('src/rpc.rs')
          text = rpc.read_text()
          text = replace_once(
              text,
              'use std::time::Duration;',
              'use std::{error::Error as StdError, fmt, time::Duration};',
              'rpc import',
          )

          marker = '''#[derive(Debug, Deserialize)]
          struct RpcError {
              code: i64,
              message: String,
          }
          '''
          insert = '''#[derive(Debug, Deserialize)]
          struct RpcError {
              code: i64,
              message: String,
          }

          #[derive(Debug)]
          struct RpcResponseError {
              code: i64,
              message: String,
          }

          impl fmt::Display for RpcResponseError {
              fn fmt(&self, formatter: &mut fmt::Formatter<'_>) -> fmt::Result {
                  write!(formatter, "Solana RPC error {}: {}", self.code, self.message)
              }
          }

          impl StdError for RpcResponseError {}

          /// 长期 monitor 用它区分“RPC 节点尚未追上 minContextSlot”和其他真实错误。
          /// 错误即使被 anyhow context 包裹，仍可沿 error chain 被识别。
          pub fn is_min_context_slot_not_reached(error: &anyhow::Error) -> bool {
              error.chain().any(|cause| {
                  cause
                      .downcast_ref::<RpcResponseError>()
                      .is_some_and(|rpc_error| rpc_error.code == MIN_CONTEXT_SLOT_NOT_REACHED_CODE)
              })
          }
          '''
          text = replace_once(text, marker, insert, 'RpcError insertion')

          start = text.index('fn parse_full_accounts_response')
          end = text.index('\n/// 校验候选池', start)
          segment = text[start:end]
          old_error = '''    if let Some(error) = envelope.error {
              bail!("Solana RPC error {}: {}", error.code, error.message);
          }'''
          new_error = '''    if let Some(error) = envelope.error {
              return Err(anyhow::Error::new(RpcResponseError {
                  code: error.code,
                  message: error.message,
              }));
          }'''
          segment = replace_once(segment, old_error, new_error, 'full-account typed error')
          text = text[:start] + segment + text[end:]

          test_marker = '''    #[test]
              fn parses_full_accounts_base64_and_preserves_order() {
          '''
          test_insert = '''    #[test]
              fn exhausted_min_context_slot_error_remains_machine_detectable() {
                  let lagging = r#"{\"jsonrpc\":\"2.0\",\"error\":{\"code\":-32016,\"message\":\"Minimum context slot has not been reached\"},\"id\":1}"#;
                  let error = parse_full_accounts_response(lagging).unwrap_err();
                  assert!(is_min_context_slot_not_reached(&error));

                  let wrapped = parse_full_accounts_response(lagging)
                      .context("outer monitor context")
                      .unwrap_err();
                  assert!(is_min_context_slot_not_reached(&wrapped));

                  let other = r#"{\"jsonrpc\":\"2.0\",\"error\":{\"code\":-32602,\"message\":\"bad params\"},\"id\":1}"#;
                  let error = parse_full_accounts_response(other).unwrap_err();
                  assert!(!is_min_context_slot_not_reached(&error));
              }

              #[test]
              fn parses_full_accounts_base64_and_preserves_order() {
          '''
          text = replace_once(text, test_marker, test_insert, 'rpc detector test')
          rpc.write_text(text)

          app = Path('src/app.rs')
          text = app.read_text()
          text = replace_once(
              text,
              '    rpc::{fetch_account_owners, fetch_accounts, verify_pool_accounts, PUBLIC_MAINNET_RPC},',
              '    rpc::{\n        fetch_account_owners, fetch_accounts, is_min_context_slot_not_reached,\n        verify_pool_accounts, PUBLIC_MAINNET_RPC,\n    },',
              'app rpc import',
          )
          text = replace_once(
              text,
              '    let mut reconnects = 0usize;\n    let mut subscription_refreshes = 0usize;',
              '    let mut reconnects = 0usize;\n    let mut context_slot_recoveries = 0usize;\n    let mut subscription_refreshes = 0usize;',
              'monitor recovery counter',
          )

          monitor_start = text.index('async fn run_opportunity_monitor')
          block_start = text.index('            let Some(result) = process_opportunity_update(', monitor_start)
          block_end = text.index('\n\n            append_records(&log_path, &result.records)?;', block_start)
          replacement = '''            let result = match process_opportunity_update(
                  client, &config, &mut state, &mut cache, &pools, &update,
              )
              .await
              {
                  Ok(result) => result,
                  Err(error) if is_min_context_slot_not_reached(&error) => {
                      context_slot_recoveries += 1;
                      println!(
                          "V3.6 monitor minContextSlot recovery: address={} slot={} recoveries={context_slot_recoveries}; rebuilding latest state and WSS session",
                          update.address, update.slot
                      );
                      tokio::time::sleep(Duration::from_secs(1)).await;
                      state = build_quote_state_for_pools(client, &config, &pools).await?;
                      cache = QuoteContextCache::build(&state, &pools)?;
                      continue 'session;
                  }
                  Err(error) => return Err(error),
              };

              let Some(result) = result else {
                  stale_updates += 1;
                  println!(
                      "V3.6 monitor QuoteState rejected stale update: address={} slot={}",
                      update.address, update.slot
                  );
                  continue;
              };'''
          text = text[:block_start] + replacement + text[block_end:]

          text = replace_once(
              text,
              'reconnects={reconnects} subscription_refreshes={subscription_refreshes}',
              'reconnects={reconnects} context_slot_recoveries={context_slot_recoveries} subscription_refreshes={subscription_refreshes}',
              'monitor final recovery metric',
          )
          app.write_text(text)
          PY
      - name: Guarded verification
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --all-targets
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets
      - name: Commit verified source only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/rpc.rs src/app.rs
          git diff --cached --exit-code && exit 1 || true
          git commit -m "fix: recover monitor from lagging min context slot"
          git push origin HEAD:main
