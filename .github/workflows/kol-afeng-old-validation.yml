name: kol-afeng-old-validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "research/kol_trading_behavior/KOL阿峰老样本验证.py"
      - ".github/workflows/kol-afeng-old-validation.yml"

permissions:
  contents: read

jobs:
  afeng-old-7-30d:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Afeng 7-30 day validation
        run: |
          python "research/kol_trading_behavior/KOL阿峰老样本验证.py" \
            --watchlist "research/kol_trading_behavior/kol_watchlist_afeng.json" \
            --chains 56 \
            --tiers primary \
            --recent-mints 240 \
            --min-first-buy-usd 100 \
            --max-event-age-hours 720 \
            --max-follower-event-age-hours 720 \
            --max-kol-history-rows 5000 \
            --pre-window-seconds 5 \
            --post-window-seconds 300 \
            --entry-window-seconds 16 \
            --max-entry-pages 50 \
            --max-market-pages 100 \
            --workers 3 \
            --output-dir /tmp/kol-afeng-old-validation

      - name: Upload Afeng old validation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kol-afeng-old-validation-${{ github.sha }}
          path: /tmp/kol-afeng-old-validation/
          if-no-files-found: warn
          retention-days: 14
