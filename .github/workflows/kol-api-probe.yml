name: kol-api-probe

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/kol-api-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe manual KOL BSC histories
        shell: bash
        run: |
          python - <<'PY'
          import json
          import statistics
          import time
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          CHAIN_ID = "56"
          KOLS = {
              "阿峰": "0xbf004bff64725914ee36d03b87d6965b0ced4903",
              "枯坐P小将": "0x2ce9d43d1cba6ae31d7f07bfe0098dfa2d833373",
              "西瓜": "0x5388668c4fa8da7f756ef8498ff24d7999999999",
          }
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          PNL_URL = "https://web3.okx.com/priapi/v1/dx/market/v2/pnl/token-list"
          TRADE_URL = "https://web3.okx.com/priapi/v1/dx/market/v2/trading-history/filter-list"

          def get_json(url, headers=None, timeout=15):
              req = urllib.request.Request(url, headers=headers or {}, method="GET")
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.status, json.loads(r.read().decode("utf-8"))

          def post_json(url, payload, headers=None, timeout=15):
              data = json.dumps(payload).encode("utf-8")
              h = {"Content-Type": "application/json"}
              h.update(headers or {})
              req = urllib.request.Request(url, data=data, headers=h, method="POST")
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.status, json.loads(r.read().decode("utf-8"))

          common_headers = {"User-Agent": UA, "Accept": "application/json"}
          pnl_headers = dict(common_headers)
          pnl_headers["Referer"] = "https://web3.okx.com/zh-hans/market/pnl/wallet-profile"
          trade_headers = dict(common_headers)
          trade_headers["Referer"] = "https://web3.okx.com/zh-hans/market/dex"

          def fetch_recent_mints(wallet, limit=10):
              params = {
                  "walletAddress": wallet,
                  "chainId": CHAIN_ID,
                  "isAsc": "false",
                  "sortType": "1",
                  "offset": "0",
                  "limit": str(limit),
                  "filterRisk": "true",
                  "filterSmallBalance": "false",
                  "t": str(int(time.time() * 1000)),
              }
              url = PNL_URL + "?" + urllib.parse.urlencode(params)
              status, payload = get_json(url, pnl_headers)
              if status != 200 or str(payload.get("code")) != "0":
                  raise RuntimeError(f"pnl failed status={status} code={payload.get('code')} msg={payload.get('msg')}")
              return ((payload.get("data") or {}).get("tokenList") or [])

          def trade_payload(wallet, mint, data_id=None):
              out = {
                  "desc": True,
                  "orderBy": "timestamp",
                  "limit": 30,
                  "tradingHistoryFilter": {
                      "chainId": CHAIN_ID,
                      "tokenContractAddress": mint,
                      "type": "0",
                      "currentUserWalletAddress": "",
                      "userAddressList": [wallet],
                      "volumeMin": "", "volumeMax": "",
                      "priceMin": "", "priceMax": "",
                      "amountMin": "", "amountMax": "",
                  },
              }
              if data_id:
                  out["dataId"] = data_id
              return out

          def fetch_history(wallet, mint, max_rows=180):
              rows = []
              data_id = None
              pages = 0
              while len(rows) < max_rows and pages < 20:
                  url = TRADE_URL + "?t=" + str(int(time.time() * 1000))
                  status, payload = post_json(url, trade_payload(wallet, mint, data_id), trade_headers)
                  if status != 200 or str(payload.get("code")) != "0":
                      raise RuntimeError(f"history failed status={status} code={payload.get('code')} msg={payload.get('msg')}")
                  data = payload.get("data") or {}
                  page = data.get("list") or []
                  if not page:
                      break
                  rows.extend(page)
                  pages += 1
                  next_id = page[-1].get("id")
                  if str(data.get("hasMore", "0")) != "1" or not next_id or next_id == data_id:
                      break
                  data_id = next_id
                  time.sleep(0.05)
              dedup = {}
              for r in rows:
                  dedup[r.get("id") or (r.get("timestamp"), r.get("userAddress"), r.get("volume"), r.get("isBuy"))] = r
              return list(dedup.values())[:max_rows]

          def side(r):
              return "BUY" if str(r.get("isBuy")) == "1" else "SELL"

          def vol(r):
              try:
                  return float(r.get("volume") or 0)
              except Exception:
                  return 0.0

          def summarize(rows):
              chron = sorted(rows, key=lambda r: int(r.get("timestamp") or 0))
              buys = [r for r in chron if side(r) == "BUY"]
              sells = [r for r in chron if side(r) == "SELL"]
              buy_vals = [vol(r) for r in buys]
              sell_vals = [vol(r) for r in sells]
              first_buy = buys[0] if buys else None
              later_buy_vals = buy_vals[1:] if len(buy_vals) > 1 else []
              return {
                  "rows": len(chron),
                  "buy_rows": len(buys),
                  "sell_rows": len(sells),
                  "buy_usd_sum": round(sum(buy_vals), 6),
                  "sell_usd_sum": round(sum(sell_vals), 6),
                  "first_buy_usd": round(vol(first_buy), 6) if first_buy else None,
                  "later_buy_median_usd": round(statistics.median(later_buy_vals), 6) if later_buy_vals else None,
                  "max_buy_usd": round(max(buy_vals), 6) if buy_vals else None,
                  "median_buy_usd": round(statistics.median(buy_vals), 6) if buy_vals else None,
                  "max_sell_usd": round(max(sell_vals), 6) if sell_vals else None,
                  "median_sell_usd": round(statistics.median(sell_vals), 6) if sell_vals else None,
                  "min_ts": min((int(r.get("timestamp") or 0) for r in chron), default=None),
                  "max_ts": max((int(r.get("timestamp") or 0) for r in chron), default=None),
              }

          def ts_text(ms):
              if not ms:
                  return None
              return datetime.fromtimestamp(ms / 1000, tz=timezone.utc).isoformat()

          for name, wallet in KOLS.items():
              print("\n=== KOL", name, wallet, "===")
              mints = fetch_recent_mints(wallet, 10)
              print("RECENT_MINT_COUNT", len(mints))
              candidates = []
              for idx, item in enumerate(mints[:8]):
                  mint = item.get("tokenContractAddress")
                  symbol = item.get("tokenSymbol")
                  latest = item.get("latestTime")
                  if not mint:
                      continue
                  rows = fetch_history(wallet, mint, max_rows=120)
                  s = summarize(rows)
                  candidate = {
                      "idx": idx,
                      "symbol": symbol,
                      "mint": mint,
                      "latestTime": latest,
                      **s,
                  }
                  candidates.append((candidate, rows))
                  print("MINT_SCAN", json.dumps(candidate, ensure_ascii=False))

              eligible = [x for x in candidates if 6 <= x[0]["rows"] <= 100 and x[0]["buy_rows"] > 0 and x[0]["sell_rows"] > 0]
              chosen = eligible[0] if eligible else (candidates[0] if candidates else None)
              if not chosen:
                  print("NO_CANDIDATE")
                  continue

              meta, rows = chosen
              print("CHOSEN", json.dumps(meta, ensure_ascii=False))
              chron = sorted(rows, key=lambda r: int(r.get("timestamp") or 0))
              # 输出最近 40 笔真实成交，避免 PnL/UI 交易次数口径干扰。
              for r in chron[-40:]:
                  print("TRADE", json.dumps({
                      "time_utc": ts_text(int(r.get("timestamp") or 0)),
                      "timestamp": r.get("timestamp"),
                      "side": side(r),
                      "usd": round(vol(r), 6),
                      "price": r.get("price"),
                      "id": r.get("id"),
                  }, ensure_ascii=False))
          PY
