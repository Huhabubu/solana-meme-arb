name: kol-api-probe

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/kol-api-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe OKX KOL APIs
        shell: bash
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.parse
          import urllib.request

          WALLET = "MRiYA4oN3158fCV8evhuCofrDzbHyYvYnGZUDJvoCsa"
          MINT = "AFbX8oGjGpmVFywbVouvhQSRmiW2aR1mohfahi4Y2AdB"
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          def get_json(url, headers=None, timeout=15):
              req = urllib.request.Request(url, headers=headers or {}, method="GET")
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.status, json.loads(r.read().decode("utf-8"))

          def post_json(url, payload, headers=None, timeout=15):
              data = json.dumps(payload).encode("utf-8")
              h = {"Content-Type": "application/json"}
              h.update(headers or {})
              req = urllib.request.Request(url, data=data, headers=h, method="POST")
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.status, json.loads(r.read().decode("utf-8"))

          common_headers = {"User-Agent": UA, "Accept": "application/json"}

          # 1) Wallet -> Mint 聚合 PnL
          pnl_params = {
              "walletAddress": WALLET,
              "chainId": "501",
              "isAsc": "false",
              "sortType": "1",
              "offset": "0",
              "limit": "10",
              "filterRisk": "true",
              "filterSmallBalance": "false",
              "t": str(int(time.time() * 1000)),
          }
          pnl_url = "https://web3.okx.com/priapi/v1/dx/market/v2/pnl/token-list?" + urllib.parse.urlencode(pnl_params)
          pnl_headers = dict(common_headers)
          pnl_headers["Referer"] = "https://web3.okx.com/zh-hans/market/pnl/wallet-profile"
          status, pnl = get_json(pnl_url, pnl_headers)
          token_list = ((pnl.get("data") or {}).get("tokenList") or [])
          print("PNL_HTTP", status, "CODE", pnl.get("code"), "TOKEN_COUNT", len(token_list))
          gst = next((x for x in token_list if x.get("tokenContractAddress") == MINT), None)
          if not gst:
              raise SystemExit("GST not found in first PnL page")
          print("PNL_GST", json.dumps({
              "symbol": gst.get("tokenSymbol"),
              "mint": gst.get("tokenContractAddress"),
              "buy_count": gst.get("totalTxBuy"),
              "sell_count": gst.get("totalTxSell"),
              "buy_volume": gst.get("buyVolume"),
              "sell_volume": gst.get("sellVolume"),
              "buy_avg_price": gst.get("buyAvgPrice"),
              "sell_avg_price": gst.get("sellAvgPrice"),
              "holding_time": gst.get("holdingTime"),
              "sell_off_time": gst.get("sellOffTime"),
              "latest_time": gst.get("latestTime"),
              "balance": gst.get("balance"),
              "total_pnl": gst.get("totalPnl"),
          }, ensure_ascii=False))

          # 2) Mint 全市场第一页 vs userAddressList 服务端过滤第一页
          trade_headers = dict(common_headers)
          trade_headers["Referer"] = "https://web3.okx.com/zh-hans/market/dex"
          base_url = "https://web3.okx.com/priapi/v1/dx/market/v2/trading-history/filter-list"

          def payload(users, data_id=None):
              out = {
                  "desc": True,
                  "orderBy": "timestamp",
                  "limit": 30,
                  "tradingHistoryFilter": {
                      "chainId": "501",
                      "tokenContractAddress": MINT,
                      "type": "0",
                      "currentUserWalletAddress": "",
                      "userAddressList": users,
                      "volumeMin": "", "volumeMax": "",
                      "priceMin": "", "priceMax": "",
                      "amountMin": "", "amountMax": "",
                  },
              }
              if data_id:
                  out["dataId"] = data_id
              return out

          url = base_url + "?t=" + str(int(time.time() * 1000))
          _, all_resp = post_json(url, payload([]), trade_headers)
          _, filtered_first = post_json(url, payload([WALLET]), trade_headers)
          all_rows = ((all_resp.get("data") or {}).get("list") or [])
          frows = ((filtered_first.get("data") or {}).get("list") or [])
          target = WALLET.lower()
          print("FILTER_TEST", json.dumps({
              "all_count": len(all_rows),
              "all_target_count": sum(str(r.get("userAddress") or "").lower() == target for r in all_rows),
              "filtered_count": len(frows),
              "filtered_target_count": sum(str(r.get("userAddress") or "").lower() == target for r in frows),
              "filtered_has_more": (filtered_first.get("data") or {}).get("hasMore"),
              "server_filter_effective": bool(frows) and all(str(r.get("userAddress") or "").lower() == target for r in frows),
          }, ensure_ascii=False))

          # 3) userAddressList=[KOL] 持续分页，恢复该 Mint 能看到的全部历史成交
          rows = []
          data_id = None
          pages = 0
          while pages < 100:
              page_url = base_url + "?t=" + str(int(time.time() * 1000))
              _, resp = post_json(page_url, payload([WALLET], data_id), trade_headers)
              if str(resp.get("code")) != "0":
                  raise SystemExit(f"trade history code={resp.get('code')} msg={resp.get('msg')}")
              data = resp.get("data") or {}
              page = data.get("list") or []
              if not page:
                  break
              rows.extend(page)
              pages += 1
              has_more = str(data.get("hasMore", "0"))
              next_id = page[-1].get("id")
              if has_more != "1" or not next_id or next_id == data_id:
                  break
              data_id = next_id
              time.sleep(0.05)

          buys = [r for r in rows if str(r.get("isBuy")) == "1"]
          sells = [r for r in rows if str(r.get("isBuy")) != "1"]
          volumes = [float(r.get("volume") or 0) for r in rows]
          timestamps = [int(r.get("timestamp") or 0) for r in rows if r.get("timestamp")]
          trade_total_counts = sorted({str(r.get("tradeTotalCount")) for r in rows if r.get("tradeTotalCount") is not None})
          unique_ids = len({r.get("id") for r in rows if r.get("id")})
          print("FILTERED_HISTORY", json.dumps({
              "pages": pages,
              "rows": len(rows),
              "unique_ids": unique_ids,
              "buy_rows": len(buys),
              "sell_rows": len(sells),
              "volume_sum": sum(volumes),
              "max_timestamp": max(timestamps) if timestamps else None,
              "min_timestamp": min(timestamps) if timestamps else None,
              "tradeTotalCount_values": trade_total_counts[:20],
              "all_addresses_match": all(str(r.get("userAddress") or "").lower() == target for r in rows),
          }, ensure_ascii=False))

          # 4) 直接对比 PnL 聚合字段与历史成交恢复值
          print("PNL_VS_HISTORY", json.dumps({
              "pnl_buy_count": gst.get("totalTxBuy"),
              "history_buy_rows": len(buys),
              "pnl_sell_count": gst.get("totalTxSell"),
              "history_sell_rows": len(sells),
              "pnl_buy_volume": gst.get("buyVolume"),
              "history_buy_volume": sum(float(r.get("volume") or 0) for r in buys),
              "pnl_sell_volume": gst.get("sellVolume"),
              "history_sell_volume": sum(float(r.get("volume") or 0) for r in sells),
              "pnl_latest_time": gst.get("latestTime"),
              "history_latest_time": max(timestamps) if timestamps else None,
          }, ensure_ascii=False))
          PY
