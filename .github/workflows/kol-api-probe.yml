name: kol-first-buy-study

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "research/kol_trading_behavior/kol_watchlist.json"
      - "research/kol_trading_behavior/KOL首买事件研究.py"
      - ".github/workflows/kol-api-probe.yml"

permissions:
  contents: read

jobs:
  bnb-study:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run BNB KOL first-buy study
        run: |
          python "research/kol_trading_behavior/KOL首买事件研究.py" \
            --chains 56 \
            --tiers primary,secondary \
            --recent-mints 5 \
            --min-first-buy-usd 100 \
            --max-event-age-hours 48 \
            --max-kol-history-rows 300 \
            --pre-window-seconds 5 \
            --post-window-seconds 300 \
            --max-market-pages 160 \
            --output-dir /tmp/kol-first-buy-bnb

      - name: Upload BNB study
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kol-first-buy-bnb-${{ github.sha }}
          path: /tmp/kol-first-buy-bnb/
          if-no-files-found: warn
          retention-days: 14

  solana-candidate-study:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Solana candidate first-buy study
        run: |
          python "research/kol_trading_behavior/KOL首买事件研究.py" \
            --chains 501 \
            --tiers solana_candidate \
            --recent-mints 3 \
            --min-first-buy-usd 50 \
            --max-event-age-hours 48 \
            --max-kol-history-rows 300 \
            --pre-window-seconds 5 \
            --post-window-seconds 300 \
            --max-market-pages 120 \
            --output-dir /tmp/kol-first-buy-solana

      - name: Upload Solana study
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kol-first-buy-solana-${{ github.sha }}
          path: /tmp/kol-first-buy-solana/
          if-no-files-found: warn
          retention-days: 14
