name: RAY Clean Event Pool Probe

on:
  workflow_dispatch:
  push:
    paths:
      - "research/ray_clean_event_pool_probe.py"
      - "research/ray_clean_event_price_reconstruct.py"
      - "research/ray_clean_event_price_reconstruct_fixed.py"
      - "research/ray_amm_second_order_probe.py"
      - "research/ray_followon_pool_activity.py"
      - "research/ray_followon_route_probe.py"
      - "research/ray_second_order_cluster_summary.py"
      - ".github/workflows/ray-clean-event-pool-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: |
          python -m py_compile research/ray_clean_event_pool_probe.py
          python -m py_compile research/ray_clean_event_price_reconstruct.py
          python -m py_compile research/ray_clean_event_price_reconstruct_fixed.py
          python -m py_compile research/ray_amm_second_order_probe.py
          python -m py_compile research/ray_followon_pool_activity.py
          python -m py_compile research/ray_followon_route_probe.py
          python -m py_compile research/ray_second_order_cluster_summary.py
      - name: Decode RAY event
        run: python research/ray_clean_event_pool_probe.py
      - name: Reconstruct CLMM prices and bot route
        run: python research/ray_clean_event_price_reconstruct_fixed.py
      - name: Measure AMM second-order impact
        run: python research/ray_amm_second_order_probe.py
      - name: Scan follow-on pool activity
        run: python research/ray_followon_pool_activity.py
      - name: Decode follow-on routes
        run: python research/ray_followon_route_probe.py
      - name: Summarize second-order cluster
        run: python research/ray_second_order_cluster_summary.py
      - name: Show reconstruction
        run: |
          cat research/output/ray_clean_event_reconstruct/reconstruction.md
          echo '=== AMM second-order ==='
          cat research/output/ray_clean_event_reconstruct/amm_second_order.json
          echo '=== follow-on pool activity ==='
          cat research/output/ray_clean_event_reconstruct/followon_pool_activity.json
          echo '=== follow-on routes ==='
          cat research/output/ray_clean_event_reconstruct/followon_route_probe.json
          echo '=== second-order cluster summary ==='
          cat research/output/ray_clean_event_reconstruct/second_order_cluster_summary.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ray-clean-event-reconstruction
          path: |
            research/output/ray_clean_event_pool_probe.json
            research/output/ray_clean_event_reconstruct/
