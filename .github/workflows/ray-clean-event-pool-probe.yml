name: RAY Clean Event Pool Probe

on:
  workflow_dispatch:
  push:
    paths:
      - "research/ray_clean_event_pool_probe.py"
      - "research/ray_clean_event_price_reconstruct.py"
      - "research/ray_clean_event_price_reconstruct_fixed.py"
      - ".github/workflows/ray-clean-event-pool-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: |
          python -m py_compile research/ray_clean_event_pool_probe.py
          python -m py_compile research/ray_clean_event_price_reconstruct.py
          python -m py_compile research/ray_clean_event_price_reconstruct_fixed.py
      - name: Decode RAY event
        run: python research/ray_clean_event_pool_probe.py
      - name: Reconstruct CLMM prices and bot route
        run: python research/ray_clean_event_price_reconstruct_fixed.py
      - name: Show reconstruction
        run: cat research/output/ray_clean_event_reconstruct/reconstruction.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ray-clean-event-reconstruction
          path: |
            research/output/ray_clean_event_pool_probe.json
            research/output/ray_clean_event_reconstruct/
