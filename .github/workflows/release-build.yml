name: release-build

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/release-build.yml"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            expected_machine: x86-64
          - runner: ubuntu-24.04-arm
            arch: aarch64
            expected_machine: ARM aarch64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust
        run: |
          rustup update stable
          rustup default stable

      - name: Resolve Rust cache key
        id: rust-version
        run: echo "version=$(rustc --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # 不同 CPU 架构使用独立 release target cache，避免 x86 与 ARM 编译产物混用。
      - name: Restore release Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-${{ matrix.arch }}-cargo-${{ steps.rust-version.outputs.version }}-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-${{ matrix.arch }}-cargo-${{ steps.rust-version.outputs.version }}-
            ${{ matrix.arch == 'x86_64' && format('{0}-release-cargo-{1}-', runner.os, steps.rust-version.outputs.version) || '' }}

      - name: Release build
        run: cargo build --release --locked

      - name: Release tests
        run: cargo test --release --locked --all-targets

      # 直接运行最终 release 二进制，而不是 cargo/debug 包装层。
      # 同时记录一轮真实监控的峰值 RSS，给 VPS 规格选择提供实测依据。
      - name: Live release monitor smoke and memory measurement
        timeout-minutes: 3
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          OPPORTUNITY_LOG_PATH: ${{ runner.temp }}/release-monitor-${{ matrix.arch }}.jsonl
          OPPORTUNITY_MONITOR_UPDATES: "1"
          OPPORTUNITY_MONITOR_MAX_SECONDS: "90"
          OPPORTUNITY_MONITOR_UPDATE_TIMEOUT_SECONDS: "45"
          OPPORTUNITY_MONITOR_MAX_RECONNECTS: "1"
        run: |
          set -o pipefail
          if [ -z "$HELIUS_API_KEY" ]; then
            echo "HELIUS_API_KEY secret is required for release deployment verification."
            exit 1
          fi
          rm -f "$OPPORTUNITY_LOG_PATH"
          /usr/bin/time -v target/release/solana-meme-arb opportunity-monitor \
            2>&1 | tee "$RUNNER_TEMP/release-monitor-${{ matrix.arch }}.log"
          test -s "$OPPORTUNITY_LOG_PATH"
          grep -q 'processed_updates=1' "$RUNNER_TEMP/release-monitor-${{ matrix.arch }}.log"
          grep 'Maximum resident set size' "$RUNNER_TEMP/release-monitor-${{ matrix.arch }}.log"
          echo "Release monitor JSONL line count: $(wc -l < "$OPPORTUNITY_LOG_PATH")"

      - name: Package deployment bundle
        env:
          EXPECTED_MACHINE: ${{ matrix.expected_machine }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          rm -rf dist
          mkdir -p dist
          cp target/release/solana-meme-arb dist/solana-meme-arb
          cp deploy/solana-meme-arb.service dist/solana-meme-arb.service
          cp deploy/monitor.env.example dist/monitor.env.example
          cp deploy/README.md dist/DEPLOY.md
          printf 'commit=%s\nrustc=%s\narch=%s\nuname_machine=%s\n' \
            "$GITHUB_SHA" "$(rustc --version)" "$RELEASE_ARCH" "$(uname -m)" > dist/BUILD-INFO.txt
          file dist/solana-meme-arb | tee dist/BINARY-FILE.txt
          grep -Fq "$EXPECTED_MACHINE" dist/BINARY-FILE.txt
          (cd dist && sha256sum solana-meme-arb > SHA256SUMS)
          ls -lh dist
          cat dist/BUILD-INFO.txt
          cat dist/BINARY-FILE.txt
          cat dist/SHA256SUMS

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v7
        with:
          name: solana-meme-arb-linux-${{ matrix.arch }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
