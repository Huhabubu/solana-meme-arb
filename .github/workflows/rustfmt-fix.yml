name: rustfmt-fix

on:
  push:
    branches:
      - agent/event-driven-monitor-v1

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/event-driven-monitor-v1

      - name: Install stable rustfmt
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt

      - name: Apply rustfmt
        run: cargo fmt --all

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No rustfmt changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "style: apply rustfmt to event monitor"
          git push origin HEAD:agent/event-driven-monitor-v1
