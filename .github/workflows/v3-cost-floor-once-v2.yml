name: v3-cost-floor-once-v2

on:
  push:
    paths:
      - '.github/workflows/v3-cost-floor-once-v2.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply execution-cost floor to live V3 curves
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/app.rs')
          text = path.read_text()

          old_import = '    opportunity::{directed_route_indices, evaluate_round_trip_curve, SwapQuote},'
          new_import = '''    opportunity::{
              apply_execution_cost, directed_route_indices, evaluate_round_trip_curve, ExecutionCost,
              SwapQuote,
          },'''
          if text.count(old_import) != 1:
              raise SystemExit(f'import match count={text.count(old_import)}')
          text = text.replace(old_import, new_import, 1)

          probe = 'const ROUND_TRIP_PROBE_LAMPORTS: [u64; 3] = [10_000_000, 50_000_000, 100_000_000];'
          constants = probe + '''
          // V3 只用这个场景验证净利润链路：当前协议基础费 5000 lamports/签名 + Jito 文档最低 tip 1000。
          // Priority Fee 保持 0 是刻意的“研究成本下界”，绝不能当成竞争性套利的真实总成本。
          const V3_COST_FLOOR_BASE_FEE_LAMPORTS: u64 = 5_000;
          const V3_COST_FLOOR_JITO_TIP_LAMPORTS: u64 = 1_000;'''
          if text.count(probe) != 1:
              raise SystemExit('probe constant mismatch')
          text = text.replace(probe, constants, 1)

          counter_anchor = '''    let mut verified_routes = 0usize;
              let mut evaluated_points = 0usize;
              let mut unavailable_points = 0usize;'''
          counter_replacement = '''    let cost_floor = ExecutionCost {
                  base_fee_lamports: V3_COST_FLOOR_BASE_FEE_LAMPORTS,
                  priority_fee_lamports: 0,
                  jito_tip_lamports: V3_COST_FLOOR_JITO_TIP_LAMPORTS,
                  other_lamports: 0,
              };
              let cost_floor_lamports = cost_floor.total_lamports()?;
              let mut verified_routes = 0usize;
              let mut evaluated_points = 0usize;
              let mut unavailable_points = 0usize;
              let mut gross_profitable_points = 0usize;
              let mut net_profitable_points = 0usize;
              println!(
                  "V3 execution cost floor: base={} priority={} jito_tip={} other={} total={} lamports; priority=0 is a lower-bound research scenario, not a live estimate",
                  cost_floor.base_fee_lamports,
                  cost_floor.priority_fee_lamports,
                  cost_floor.jito_tip_lamports,
                  cost_floor.other_lamports,
                  cost_floor_lamports
              );'''
          if text.count(counter_anchor) != 1:
              raise SystemExit(f'counter anchor count={text.count(counter_anchor)}')
          text = text.replace(counter_anchor, counter_replacement, 1)

          loop_start = text.index('            for (index, opportunity) in curve_indices.into_iter().zip(curve.iter()) {')
          loop_end_marker = '                evaluated_points += 1;\n            }'
          loop_end = text.index(loop_end_marker, loop_start) + len(loop_end_marker)
          new_loop = '''            for (index, opportunity) in curve_indices.into_iter().zip(curve.iter()) {
                  if opportunity.base_mint != WSOL || opportunity.intermediate_mint != token.mint {
                      bail!("V3 round trip produced unexpected mints");
                  }
                  if opportunity.input_amount != ROUND_TRIP_PROBE_LAMPORTS[index] {
                      bail!("V3 round-trip result no longer matches original probe amount");
                  }
                  let net = apply_execution_cost(opportunity, cost_floor)?;
                  if opportunity.gross_profit_raw > 0 {
                      gross_profitable_points += 1;
                  }
                  if net.is_profitable() {
                      net_profitable_points += 1;
                  }
                  if net.net_profit_raw > opportunity.gross_profit_raw {
                      bail!("execution cost unexpectedly improved profit");
                  }
                  println!(
                      "{}/WSOL V3 curve point: {}->{} input={} token_out={} final={} gross_profit_raw={} gross_return_ppm={} cost_floor_lamports={} net_profit_floor_raw={} net_return_floor_ppm={} slots={}..{}",
                      token.symbol,
                      first_pool.dex,
                      second_pool.dex,
                      opportunity.input_amount,
                      opportunity.intermediate_amount,
                      opportunity.final_amount,
                      opportunity.gross_profit_raw,
                      opportunity.gross_return_ppm,
                      net.execution_cost_lamports,
                      net.net_profit_raw,
                      net.net_return_ppm,
                      opportunity.oldest_slot,
                      opportunity.newest_slot
                  );
                  evaluated_points += 1;
              }'''
          text = text[:loop_start] + new_loop + text[loop_end:]

          final_marker = '''    println!(
              "V3 all-DEX multi-size round-trip verification passed for {verified_routes} routes: {evaluated_points} evaluated, {unavailable_points} insufficient-liquidity points"
          );'''
          final_replacement = '''    if net_profitable_points > gross_profitable_points {
              bail!("net-profitable point count cannot exceed gross-profitable point count");
          }
          println!(
              "V3 all-DEX multi-size round-trip verification passed for {verified_routes} routes: {evaluated_points} evaluated, {unavailable_points} insufficient-liquidity points, {gross_profitable_points} gross-positive, {net_profitable_points} positive under {cost_floor_lamports}-lamport cost floor"
          );'''
          if text.count(final_marker) != 1:
              raise SystemExit(f'final marker count={text.count(final_marker)}')
          text = text.replace(final_marker, final_replacement, 1)

          path.write_text(text)
          PY

      - name: Install stable Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt

      - name: Format Rust
        run: cargo fmt --all

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.rs
          git diff --cached --quiet && { echo "No V3 cost changes produced"; exit 1; }
          git commit -m "feat: apply V3 execution-cost floor to live curves"
          git push
