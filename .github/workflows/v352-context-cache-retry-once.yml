name: v352-context-cache-retry-once

on:
  push:
    paths:
      - '.github/workflows/v352-context-cache-retry-once.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy

      - name: Resolve Rust cache key
        id: rust-version
        run: echo "version=$(rustc --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Restore Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ steps.rust-version.outputs.version }}-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ steps.rust-version.outputs.version }}-

      - name: Replay V3.5.2 source-generation steps
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/v352-context-cache-once.yml').read_text().splitlines()
          wanted = [
              'Add local quote context cache',
              'Expose QuoteState account snapshots and register module',
              'Cache Meteora BinArrays for both swap directions',
              'Route V3.5 E2E through local contexts',
          ]

          def run_body(name):
              marker = f'      - name: {name}'
              try:
                  start = workflow.index(marker)
              except ValueError:
                  raise SystemExit(f'missing source-generation step: {name}')
              run_line = start + 1
              while run_line < len(workflow) and workflow[run_line] != '        run: |':
                  run_line += 1
              if run_line >= len(workflow):
                  raise SystemExit(f'missing run body for: {name}')
              body = []
              i = run_line + 1
              while i < len(workflow) and not workflow[i].startswith('      - name: '):
                  line = workflow[i]
                  body.append(line[10:] if line.startswith('          ') else line)
                  i += 1
              script = '\n'.join(body).rstrip() + '\n'
              print(f'--- replaying: {name} ---')
              subprocess.run(['bash', '-e', '-c', script], check=True)

          for name in wanted:
              run_body(name)
          PY

      - name: Align Orca and Meteora generated types
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/quote_context.rs')
          text = path.read_text()
          old_import = 'use anchor_client::solana_sdk::{account::Account, clock::Clock, pubkey::Pubkey};'
          new_import = 'use anchor_client::solana_sdk::{account::Account, clock::Clock, pubkey::Pubkey as MeteoraPubkey};\nuse solana_pubkey::Pubkey as OrcaPubkey;'
          if text.count(old_import) != 1:
              raise SystemExit(f'pubkey import anchor count={text.count(old_import)}')
          text = text.replace(old_import, new_import, 1)
          text = text.replace('HashMap<Pubkey, BinArray>', 'HashMap<MeteoraPubkey, BinArray>')
          text = text.replace('Pubkey::from_str(input_mint)', 'OrcaPubkey::from_str(input_mint)')
          text = text.replace('Pubkey::from_str(ORCA_WHIRLPOOL_PROGRAM_ID)', 'OrcaPubkey::from_str(ORCA_WHIRLPOOL_PROGRAM_ID)')
          text = text.replace('Pubkey::from_str(&pool.address)', 'OrcaPubkey::from_str(&pool.address)')
          text = text.replace('quote.token_out', 'quote.token_est_out')
          path.write_text(text)
          PY

      - name: Format
        run: cargo fmt --all

      - name: Compile check
        run: cargo check --all-targets

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --all-targets

      - name: Commit source integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/quote_context.rs src/main.rs src/state.rs src/app.rs
          git diff --cached --quiet && { echo "No V3.5.2 source changes produced"; exit 1; }
          git commit -m "feat: cache local pool quote contexts"
          git push
