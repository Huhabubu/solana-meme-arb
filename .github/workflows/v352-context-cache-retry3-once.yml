name: v352-context-cache-retry3-once

on:
  push:
    paths:
      - '.github/workflows/v352-context-cache-retry3-once.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy

      - name: Resolve Rust cache key
        id: rust-version
        run: echo "version=$(rustc --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Restore Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ steps.rust-version.outputs.version }}-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ steps.rust-version.outputs.version }}-

      - name: Replay V3.5.2 generated source through Orca boxing
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/v352-context-cache-retry2-once.yml').read_text().splitlines()

          def run_body(name):
              marker = f'      - name: {name}'
              try:
                  start = workflow.index(marker)
              except ValueError:
                  raise SystemExit(f'missing replay step: {name}')
              run_line = start + 1
              while run_line < len(workflow) and workflow[run_line] != '        run: |':
                  run_line += 1
              if run_line >= len(workflow):
                  raise SystemExit(f'missing run body: {name}')
              body = []
              i = run_line + 1
              while i < len(workflow) and not workflow[i].startswith('      - name: '):
                  line = workflow[i]
                  body.append(line[10:] if line.startswith('          ') else line)
                  i += 1
              subprocess.run(['bash', '-e', '-c', '\n'.join(body).rstrip() + '\n'], check=True)

          run_body('Replay generated source and type alignment')
          run_body('Box large Orca quote context variant')
          PY

      - name: Box remaining quote context variants
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/quote_context.rs')
          text = path.read_text()

          replacements = {
              '    Raydium(RaydiumQuoteContext),': '    Raydium(Box<RaydiumQuoteContext>),',
              '    Meteora(MeteoraQuoteContext),': '    Meteora(Box<MeteoraQuoteContext>),',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'enum variant anchor mismatch: {old!r} count={text.count(old)}')
              text = text.replace(old, new, 1)

          def box_constructor(text, prefix, end_marker):
              start = text.find(prefix)
              end = text.find(end_marker, start)
              if start < 0 or end < 0:
                  raise SystemExit(f'constructor boundary mismatch for {prefix}: {start}/{end}')
              segment = text[start:end]
              boxed_prefix = prefix.replace('(', '(Box::new(', 1)
              segment = segment.replace(prefix, boxed_prefix, 1)
              close = segment.rfind('}))')
              if close < 0:
                  raise SystemExit(f'constructor closing delimiter missing for {prefix}')
              segment = segment[:close] + '})))' + segment[close + 3:]
              return text[:start] + segment + text[end:]

          text = box_constructor(
              text,
              'Ok(PoolQuoteContext::Raydium(RaydiumQuoteContext {',
              '\n}\n\nfn build_orca_context(',
          )
          text = box_constructor(
              text,
              'Ok(PoolQuoteContext::Meteora(MeteoraQuoteContext {',
              '\n}\n\n#[cfg(test)]',
          )

          # 单元测试里的 synthetic Raydium Context 同样按统一 boxed enum 构造。
          test_old = 'PoolQuoteContext::Raydium(RaydiumQuoteContext {'
          if text.count(test_old) != 1:
              raise SystemExit(f'test Raydium constructor anchor count={text.count(test_old)}')
          text = text.replace(test_old, 'PoolQuoteContext::Raydium(Box::new(RaydiumQuoteContext {', 1)
          test_start = text.find('fn raydium_context(')
          test_end = text.find('\n    #[test]', test_start)
          if test_start < 0 or test_end < 0:
              raise SystemExit('raydium_context test helper boundary missing')
          segment = text[test_start:test_end]
          close = segment.rfind('})')
          if close < 0:
              raise SystemExit('raydium_context test helper closing delimiter missing')
          segment = segment[:close] + '}))' + segment[close + 2:]
          text = text[:test_start] + segment + text[test_end:]

          path.write_text(text)
          PY

      - name: Format
        run: cargo fmt --all

      - name: Compile check
        run: cargo check --all-targets

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --all-targets

      - name: Commit source integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/quote_context.rs src/main.rs src/state.rs src/app.rs
          git diff --cached --quiet && { echo "No V3.5.2 source changes produced"; exit 1; }
          git commit -m "feat: cache local pool quote contexts"
          git push
