name: v36-persistence-once

on:
  push:
    paths:
      - '.github/workflows/v36-persistence-once.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy

      - name: Resolve Rust cache key
        id: rust-version
        run: echo "version=$(rustc --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Restore Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ steps.rust-version.outputs.version }}-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ steps.rust-version.outputs.version }}-

      - name: Add JSONL opportunity persistence and statistics
        run: |
          cat > src/persistence.rs <<'RS'
          use std::{
              collections::BTreeMap,
              fs::{self, File, OpenOptions},
              io::{BufRead, BufReader, BufWriter, Write},
              path::Path,
          };

          use anyhow::{bail, Context, Result};
          use serde::{Deserialize, Serialize};

          use crate::opportunity::{LiquidityStage, OpportunityEvent, OpportunityEventOutcome};

          pub const OPPORTUNITY_RECORD_SCHEMA_VERSION: u32 = 1;

          #[derive(Debug, Clone, Copy, PartialEq, Eq, Serialize, Deserialize)]
          #[serde(rename_all = "snake_case")]
          pub enum OpportunityRecordStatus {
              Evaluated,
              InsufficientLiquidity,
          }

          #[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize)]
          pub struct OpportunityRecord {
              pub schema_version: u32,
              pub observed_at_unix_ms: u64,
              pub trigger_slot: u64,
              pub trigger_account: String,
              pub trigger_subscription_id: u64,
              pub token_mint: String,
              pub first_dex: String,
              pub first_pool: String,
              pub second_dex: String,
              pub second_pool: String,
              pub input_amount: u64,
              pub status: OpportunityRecordStatus,
              pub liquidity_stage: Option<String>,
              pub intermediate_amount: Option<u64>,
              pub final_amount: Option<u64>,
              pub gross_profit_raw: Option<i128>,
              pub gross_return_ppm: Option<i128>,
              pub execution_cost_lamports: Option<u64>,
              pub net_profit_raw: Option<i128>,
              pub net_return_ppm: Option<i128>,
              pub oldest_slot: Option<u64>,
              pub newest_slot: Option<u64>,
          }

          impl OpportunityRecord {
              pub fn from_event(
                  event: &OpportunityEvent,
                  observed_at_unix_ms: u64,
                  trigger_slot: u64,
                  trigger_account: &str,
                  trigger_subscription_id: u64,
              ) -> Result<Self> {
                  if observed_at_unix_ms == 0 {
                      bail!("opportunity record observation time must be positive");
                  }
                  if trigger_account.trim().is_empty() {
                      bail!("opportunity record trigger account cannot be empty");
                  }

                  let (
                      status,
                      liquidity_stage,
                      intermediate_amount,
                      final_amount,
                      gross_profit_raw,
                      gross_return_ppm,
                      execution_cost_lamports,
                      net_profit_raw,
                      net_return_ppm,
                      oldest_slot,
                      newest_slot,
                  ) = match event.outcome {
                      OpportunityEventOutcome::Evaluated {
                          intermediate_amount,
                          final_amount,
                          gross_profit_raw,
                          gross_return_ppm,
                          execution_cost_lamports,
                          net_profit_raw,
                          net_return_ppm,
                          oldest_slot,
                          newest_slot,
                      } => (
                          OpportunityRecordStatus::Evaluated,
                          None,
                          Some(intermediate_amount),
                          Some(final_amount),
                          Some(gross_profit_raw),
                          Some(gross_return_ppm),
                          Some(execution_cost_lamports),
                          Some(net_profit_raw),
                          Some(net_return_ppm),
                          Some(oldest_slot),
                          Some(newest_slot),
                      ),
                      OpportunityEventOutcome::InsufficientLiquidity { stage } => (
                          OpportunityRecordStatus::InsufficientLiquidity,
                          Some(match stage {
                              LiquidityStage::FirstLeg => "first_leg".to_owned(),
                              LiquidityStage::SecondLeg => "second_leg".to_owned(),
                          }),
                          None,
                          None,
                          None,
                          None,
                          None,
                          None,
                          None,
                          None,
                          None,
                      ),
                  };

                  let record = Self {
                      schema_version: OPPORTUNITY_RECORD_SCHEMA_VERSION,
                      observed_at_unix_ms,
                      trigger_slot,
                      trigger_account: trigger_account.to_owned(),
                      trigger_subscription_id,
                      token_mint: event.token_mint.clone(),
                      first_dex: event.first_dex.to_string(),
                      first_pool: event.first_pool.clone(),
                      second_dex: event.second_dex.to_string(),
                      second_pool: event.second_pool.clone(),
                      input_amount: event.input_amount,
                      status,
                      liquidity_stage,
                      intermediate_amount,
                      final_amount,
                      gross_profit_raw,
                      gross_return_ppm,
                      execution_cost_lamports,
                      net_profit_raw,
                      net_return_ppm,
                      oldest_slot,
                      newest_slot,
                  };
                  record.validate()?;
                  Ok(record)
              }

              fn validate(&self) -> Result<()> {
                  if self.schema_version != OPPORTUNITY_RECORD_SCHEMA_VERSION {
                      bail!(
                          "unsupported opportunity record schema version: {}",
                          self.schema_version
                      );
                  }
                  if self.observed_at_unix_ms == 0
                      || self.trigger_account.trim().is_empty()
                      || self.token_mint.trim().is_empty()
                      || self.first_dex.trim().is_empty()
                      || self.first_pool.trim().is_empty()
                      || self.second_dex.trim().is_empty()
                      || self.second_pool.trim().is_empty()
                      || self.input_amount == 0
                  {
                      bail!("opportunity record contains an empty required field");
                  }

                  let evaluated_fields = [
                      self.intermediate_amount.is_some(),
                      self.final_amount.is_some(),
                      self.gross_profit_raw.is_some(),
                      self.gross_return_ppm.is_some(),
                      self.execution_cost_lamports.is_some(),
                      self.net_profit_raw.is_some(),
                      self.net_return_ppm.is_some(),
                      self.oldest_slot.is_some(),
                      self.newest_slot.is_some(),
                  ];
                  match self.status {
                      OpportunityRecordStatus::Evaluated => {
                          if self.liquidity_stage.is_some()
                              || evaluated_fields.iter().any(|present| !present)
                          {
                              bail!("evaluated opportunity record has inconsistent optional fields");
                          }
                      }
                      OpportunityRecordStatus::InsufficientLiquidity => {
                          if !matches!(self.liquidity_stage.as_deref(), Some("first_leg" | "second_leg"))
                              || evaluated_fields.iter().any(|present| *present)
                          {
                              bail!(
                                  "insufficient-liquidity record has inconsistent optional fields"
                              );
                          }
                      }
                  }
                  Ok(())
              }
          }

          pub fn append_records(path: &Path, records: &[OpportunityRecord]) -> Result<()> {
              if records.is_empty() {
                  bail!("cannot append an empty opportunity record batch");
              }
              if let Some(parent) = path.parent().filter(|parent| !parent.as_os_str().is_empty()) {
                  fs::create_dir_all(parent).with_context(|| {
                      format!("failed to create opportunity log directory: {}", parent.display())
                  })?;
              }
              let file = OpenOptions::new()
                  .create(true)
                  .append(true)
                  .open(path)
                  .with_context(|| format!("failed to open opportunity log: {}", path.display()))?;
              let mut writer = BufWriter::new(file);
              for record in records {
                  record.validate()?;
                  serde_json::to_writer(&mut writer, record)
                      .context("failed to serialize opportunity record")?;
                  writer
                      .write_all(b"\n")
                      .context("failed to terminate opportunity JSONL record")?;
              }
              writer.flush().context("failed to flush opportunity JSONL log")?;
              Ok(())
          }

          pub fn read_records(path: &Path) -> Result<Vec<OpportunityRecord>> {
              let file = File::open(path)
                  .with_context(|| format!("failed to open opportunity log: {}", path.display()))?;
              let reader = BufReader::new(file);
              let mut records = Vec::new();
              for (index, line) in reader.lines().enumerate() {
                  let line = line.with_context(|| {
                      format!("failed to read opportunity JSONL line {}", index + 1)
                  })?;
                  if line.trim().is_empty() {
                      bail!("opportunity JSONL contains blank line {}", index + 1);
                  }
                  let record: OpportunityRecord = serde_json::from_str(&line).with_context(|| {
                      format!("invalid opportunity JSONL line {}", index + 1)
                  })?;
                  record.validate().with_context(|| {
                      format!("invalid opportunity record semantics at line {}", index + 1)
                  })?;
                  records.push(record);
              }
              Ok(records)
          }

          #[derive(Debug, Clone, PartialEq, Eq, PartialOrd, Ord)]
          pub struct OpportunityGroupKey {
              pub token_mint: String,
              pub first_dex: String,
              pub first_pool: String,
              pub second_dex: String,
              pub second_pool: String,
              pub input_amount: u64,
          }

          #[derive(Debug, Clone, PartialEq, Eq, Default)]
          pub struct OpportunityGroupStats {
              pub total: u64,
              pub evaluated: u64,
              pub insufficient_liquidity: u64,
              pub gross_positive: u64,
              pub net_positive: u64,
              pub best_net_profit_raw: Option<i128>,
          }

          #[derive(Debug, Clone, PartialEq, Eq, Default)]
          pub struct OpportunityStats {
              pub total: u64,
              pub evaluated: u64,
              pub insufficient_liquidity: u64,
              pub gross_positive: u64,
              pub net_positive: u64,
              pub best_net_profit_raw: Option<i128>,
              pub groups: BTreeMap<OpportunityGroupKey, OpportunityGroupStats>,
          }

          pub fn summarize_records(records: &[OpportunityRecord]) -> Result<OpportunityStats> {
              let mut stats = OpportunityStats::default();
              for record in records {
                  record.validate()?;
                  let key = OpportunityGroupKey {
                      token_mint: record.token_mint.clone(),
                      first_dex: record.first_dex.clone(),
                      first_pool: record.first_pool.clone(),
                      second_dex: record.second_dex.clone(),
                      second_pool: record.second_pool.clone(),
                      input_amount: record.input_amount,
                  };
                  let group = stats.groups.entry(key).or_default();
                  stats.total += 1;
                  group.total += 1;

                  match record.status {
                      OpportunityRecordStatus::Evaluated => {
                          let gross_profit = record
                              .gross_profit_raw
                              .context("validated evaluated record lost gross profit")?;
                          let net_profit = record
                              .net_profit_raw
                              .context("validated evaluated record lost net profit")?;
                          stats.evaluated += 1;
                          group.evaluated += 1;
                          if gross_profit > 0 {
                              stats.gross_positive += 1;
                              group.gross_positive += 1;
                          }
                          if net_profit > 0 {
                              stats.net_positive += 1;
                              group.net_positive += 1;
                          }
                          update_best(&mut stats.best_net_profit_raw, net_profit);
                          update_best(&mut group.best_net_profit_raw, net_profit);
                      }
                      OpportunityRecordStatus::InsufficientLiquidity => {
                          stats.insufficient_liquidity += 1;
                          group.insufficient_liquidity += 1;
                      }
                  }
              }
              Ok(stats)
          }

          fn update_best(current: &mut Option<i128>, candidate: i128) {
              if current.is_none_or(|value| candidate > value) {
                  *current = Some(candidate);
              }
          }

          #[cfg(test)]
          mod tests {
              use std::{
                  fs,
                  time::{SystemTime, UNIX_EPOCH},
              };

              use super::*;
              use crate::{model::Dex, opportunity::OpportunityEventOutcome};

              fn evaluated_event(net_profit: i128, gross_profit: i128) -> OpportunityEvent {
                  OpportunityEvent {
                      token_mint: "TOKEN".into(),
                      first_dex: Dex::Raydium,
                      first_pool: "pool-a".into(),
                      second_dex: Dex::Orca,
                      second_pool: "pool-b".into(),
                      input_amount: 10_000_000,
                      outcome: OpportunityEventOutcome::Evaluated {
                          intermediate_amount: 20_000_000,
                          final_amount: 10_000_100,
                          gross_profit_raw: gross_profit,
                          gross_return_ppm: 10,
                          execution_cost_lamports: 6_000,
                          net_profit_raw: net_profit,
                          net_return_ppm: 4,
                          oldest_slot: 100,
                          newest_slot: 101,
                      },
                  }
              }

              fn insufficient_event() -> OpportunityEvent {
                  OpportunityEvent {
                      token_mint: "TOKEN".into(),
                      first_dex: Dex::Raydium,
                      first_pool: "pool-a".into(),
                      second_dex: Dex::Orca,
                      second_pool: "pool-b".into(),
                      input_amount: 50_000_000,
                      outcome: OpportunityEventOutcome::InsufficientLiquidity {
                          stage: LiquidityStage::SecondLeg,
                      },
                  }
              }

              fn record(event: &OpportunityEvent) -> OpportunityRecord {
                  OpportunityRecord::from_event(event, 1_000, 99, "trigger", 7).unwrap()
              }

              fn temp_path(name: &str) -> std::path::PathBuf {
                  let nanos = SystemTime::now()
                      .duration_since(UNIX_EPOCH)
                      .unwrap()
                      .as_nanos();
                  std::env::temp_dir().join(format!(
                      "solana-meme-arb-{name}-{}-{nanos}.jsonl",
                      std::process::id()
                  ))
              }

              #[test]
              fn event_conversion_preserves_evaluated_and_liquidity_states() {
                  let evaluated = record(&evaluated_event(4_000, 10_000));
                  assert_eq!(evaluated.status, OpportunityRecordStatus::Evaluated);
                  assert_eq!(evaluated.net_profit_raw, Some(4_000));
                  assert_eq!(evaluated.liquidity_stage, None);

                  let insufficient = record(&insufficient_event());
                  assert_eq!(
                      insufficient.status,
                      OpportunityRecordStatus::InsufficientLiquidity
                  );
                  assert_eq!(insufficient.liquidity_stage.as_deref(), Some("second_leg"));
                  assert_eq!(insufficient.net_profit_raw, None);
              }

              #[test]
              fn jsonl_append_is_additive_and_round_trips() {
                  let path = temp_path("append");
                  let first = record(&evaluated_event(4_000, 10_000));
                  let second = record(&insufficient_event());
                  append_records(&path, std::slice::from_ref(&first)).unwrap();
                  append_records(&path, std::slice::from_ref(&second)).unwrap();
                  let loaded = read_records(&path).unwrap();
                  assert_eq!(loaded, vec![first, second]);
                  fs::remove_file(path).unwrap();
              }

              #[test]
              fn malformed_jsonl_is_reported_instead_of_skipped() {
                  let path = temp_path("bad");
                  fs::write(&path, b"{not-json}\n").unwrap();
                  assert!(read_records(&path).is_err());
                  fs::remove_file(path).unwrap();
              }

              #[test]
              fn summary_counts_profitability_liquidity_and_route_amount_groups() {
                  let records = vec![
                      record(&evaluated_event(4_000, 10_000)),
                      record(&evaluated_event(-2_000, -1_000)),
                      record(&insufficient_event()),
                  ];
                  let stats = summarize_records(&records).unwrap();
                  assert_eq!(stats.total, 3);
                  assert_eq!(stats.evaluated, 2);
                  assert_eq!(stats.insufficient_liquidity, 1);
                  assert_eq!(stats.gross_positive, 1);
                  assert_eq!(stats.net_positive, 1);
                  assert_eq!(stats.best_net_profit_raw, Some(4_000));
                  assert_eq!(stats.groups.len(), 2);
                  let ten_million = stats
                      .groups
                      .iter()
                      .find(|(key, _)| key.input_amount == 10_000_000)
                      .unwrap()
                      .1;
                  assert_eq!(ten_million.total, 2);
                  assert_eq!(ten_million.evaluated, 2);
                  assert_eq!(ten_million.net_positive, 1);
              }
          }
          RS

      - name: Register persistence module and wire live E2E
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/main.rs')
          text = path.read_text()
          anchor = 'mod opportunity;\n'
          if text.count(anchor) != 1:
              raise SystemExit(f'main persistence module anchor count={text.count(anchor)}')
          text = text.replace(anchor, anchor + 'mod persistence;\n', 1)
          path.write_text(text)

          path = Path('src/app.rs')
          text = path.read_text()
          import_anchor = '    quote_context::{QuoteContextCache, QuoteRuntime},\n'
          import_replacement = import_anchor + '''    persistence::{
                  append_records, read_records, summarize_records, OpportunityRecord,
              },
          '''
          if text.count(import_anchor) != 1:
              raise SystemExit(f'app persistence import anchor count={text.count(import_anchor)}')
          text = text.replace(import_anchor, import_replacement, 1)

          counter_anchor = '''    let mut event_count = 0usize;
              let mut evaluated_count = 0usize;
              let mut unavailable_count = 0usize;
              let mut net_positive_count = 0usize;
          '''
          counter_replacement = counter_anchor + '    let mut persistence_events = Vec::new();\n'
          if text.count(counter_anchor) != 1:
              raise SystemExit(f'event counter anchor count={text.count(counter_anchor)}')
          text = text.replace(counter_anchor, counter_replacement, 1)

          events_anchor = '''        let events = evaluate_cached_route_events(&cache, route, cost_floor, runtime)?;
                  for event in &events {
          '''
          events_replacement = '''        let events = evaluate_cached_route_events(&cache, route, cost_floor, runtime)?;
                  persistence_events.extend(events.iter().cloned());
                  for event in &events {
          '''
          if text.count(events_anchor) != 1:
              raise SystemExit(f'event collection anchor count={text.count(events_anchor)}')
          text = text.replace(events_anchor, events_replacement, 1)

          final_anchor = '''    println!(
                  "V3.5 local-context opportunity recompute verified: {} affected pool(s), {} related route(s), {} event(s), {} evaluated, {} insufficient-liquidity, {} net-positive",
                  affected_pools.len(),
                  routes.len(),
                  event_count,
                  evaluated_count,
                  unavailable_count,
                  net_positive_count
              );
              Ok(())
          }
          '''
          final_replacement = '''    println!(
                  "V3.5 local-context opportunity recompute verified: {} affected pool(s), {} related route(s), {} event(s), {} evaluated, {} insufficient-liquidity, {} net-positive",
                  affected_pools.len(),
                  routes.len(),
                  event_count,
                  evaluated_count,
                  unavailable_count,
                  net_positive_count
              );

              if let Ok(log_path) = std::env::var("OPPORTUNITY_LOG_PATH") {
                  if log_path.trim().is_empty() {
                      bail!("OPPORTUNITY_LOG_PATH cannot be empty when configured");
                  }
                  let path = std::path::Path::new(&log_path);
                  let before_count = if path.exists() {
                      read_records(path)?.len()
                  } else {
                      0
                  };
                  let observed_at_unix_ms = unix_timestamp_millis()?;
                  let records = persistence_events
                      .iter()
                      .map(|event| {
                          OpportunityRecord::from_event(
                              event,
                              observed_at_unix_ms,
                              update.slot,
                              &update.address,
                              update.subscription_id,
                          )
                      })
                      .collect::<Result<Vec<_>>>()?;
                  if records.len() != event_count {
                      bail!("V3.6 persistence record count diverged from opportunity events");
                  }
                  append_records(path, &records)?;
                  let stored = read_records(path)?;
                  if stored.len() != before_count + records.len() {
                      bail!("V3.6 persistence append count mismatch");
                  }
                  let stats = summarize_records(&stored)?;
                  println!(
                      "V3.6 persistence verified: path={} appended={} total={} evaluated={} insufficient_liquidity={} gross_positive={} net_positive={} groups={}",
                      path.display(),
                      records.len(),
                      stats.total,
                      stats.evaluated,
                      stats.insufficient_liquidity,
                      stats.gross_positive,
                      stats.net_positive,
                      stats.groups.len()
                  );
              }
              Ok(())
          }
          '''
          if text.count(final_anchor) != 1:
              raise SystemExit(f'final persistence anchor count={text.count(final_anchor)}')
          text = text.replace(final_anchor, final_replacement, 1)

          timestamp_anchor = '''fn unix_timestamp() -> Result<u64> {
              Ok(SystemTime::now()
                  .duration_since(UNIX_EPOCH)
                  .context("system clock is before Unix epoch")?
                  .as_secs())
          }
          '''
          timestamp_replacement = timestamp_anchor + '''
          fn unix_timestamp_millis() -> Result<u64> {
              let millis = SystemTime::now()
                  .duration_since(UNIX_EPOCH)
                  .context("system clock is before Unix epoch")?
                  .as_millis();
              u64::try_from(millis).context("Unix millisecond timestamp overflow")
          }
          '''
          if text.count(timestamp_anchor) != 1:
              raise SystemExit(f'timestamp helper anchor count={text.count(timestamp_anchor)}')
          text = text.replace(timestamp_anchor, timestamp_replacement, 1)
          path.write_text(text)
          PY

      - name: Format
        run: cargo fmt --all

      - name: Compile check
        run: cargo check --all-targets

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --all-targets

      - name: Commit source integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/persistence.rs src/main.rs src/app.rs
          git diff --cached --quiet && { echo "No V3.6 persistence source changes produced"; exit 1; }
          git commit -m "feat: persist opportunity events as JSONL"
          git push
