name: v362-monitor-retry2-once

on:
  push:
    paths:
      - '.github/workflows/v362-monitor-retry2-once.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy

      - name: Resolve Rust cache key
        id: rust-version
        run: echo "version=$(rustc --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Restore Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ steps.rust-version.outputs.version }}-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ steps.rust-version.outputs.version }}-

      - name: Replay Clippy-clean V3.6.2 source generation
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/v362-monitor-retry-once.yml').read_text().splitlines()
          wanted = [
              'Replay V3.6.2 source-generation steps',
              'Make monitor helpers Clippy-clean',
          ]

          def run_body(name):
              marker = f'      - name: {name}'
              start = workflow.index(marker)
              run_line = start + 1
              while workflow[run_line] != '        run: |':
                  run_line += 1
              body = []
              i = run_line + 1
              while i < len(workflow) and not workflow[i].startswith('      - name: '):
                  line = workflow[i]
                  body.append(line[10:] if line.startswith('          ') else line)
                  i += 1
              subprocess.run(['bash', '-e', '-c', '\n'.join(body).rstrip() + '\n'], check=True)

          for name in wanted:
              run_body(name)
          PY

      - name: Remove exact unused import reported by Clippy
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('src/app.rs')
          text = path.read_text()
          old = 'append_records, read_records, summarize_records, OpportunityRecord, OpportunityStats,'
          new = 'append_records, read_records, summarize_records, OpportunityRecord,'
          if text.count(old) != 1:
              raise SystemExit(f'OpportunityStats import anchor count={text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Format
        run: cargo fmt --all

      - name: Compile check
        run: cargo check --all-targets

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --all-targets

      - name: Commit source integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/monitor.rs src/persistence.rs src/main.rs src/app.rs
          git diff --cached --quiet && { echo "No V3.6.2 monitor changes produced"; exit 1; }
          git commit -m "feat: run continuous opportunity monitor"
          git push
