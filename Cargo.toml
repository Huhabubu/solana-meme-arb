[package]
name = "solana-meme-arb"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anchor-client = "0.31.0"
anchor-lang = "0.31.0"
anyhow = "1"
base64 = "0.22"
bincode = "1.3.3"
blake3 = "1"
bs58 = "0.5"
commons = { git = "https://github.com/MeteoraAg/dlmm-sdk.git", rev = "fb02e51ae677bbd18e76543f702dae40632426db" }
futures-util = "0.3"
orca_whirlpools_client = "8.0.0"
orca_whirlpools_core = "2.1.1"
reqwest = { version = "0.12", features = ["json"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-pubkey = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
